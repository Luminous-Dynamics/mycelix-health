---
manifest_version: "0"
name: health
integrity:
  network_seed: ~
  properties:
    medication_activation:
      schema_version: 1
      # Fail closed by default. Production/test deployments must repack the DNA
      # with explicit trusted AgentPubKeys before exact verifier authorizations validate.
      root_authorities: []
      # v1 exact-receipt verifier authorizations may live for at most 15 minutes.
      # The integrity zome also hard-caps this value, so accidental packaging with a
      # longer window fails validation rather than silently weakening the contract.
      max_verifier_authorization_duration_micros: 900000000
    medication_emergency:
      schema_version: 1
      # Emergency override trust is intentionally distinct from ordinary qualified
      # activation trust. Empty by default: no emergency activation can validate
      # until a deployment deliberately repacks the DNA with trusted root keys.
      root_authorities: []
      # Exact-receipt emergency verifier authorizations are also capped at 15 minutes.
      # Deployments may choose a shorter value when repacking the DNA.
      max_verifier_authorization_duration_micros: 900000000
    medication_dispense:
      schema_version: 1
      # Fail closed by default. Deployments must explicitly pin allocator AgentPubKeys.
      # The ordered list is part of the DNA hash; each MedicationRequest artifact maps
      # deterministically to exactly one allocator by digest prefix modulo list length.
      slot_allocators: []
      # Exact refill-slot authorizations are short-lived and hard-capped by the
      # integrity zome at five minutes. Deployments may choose a shorter value.
      max_slot_authorization_duration_micros: 300000000
  zomes:
    # Tier 1: MVP Core
    - name: patient_integrity
      path: ../target/wasm32-unknown-unknown/release/patient_integrity.wasm
    - name: provider_integrity
      path: ../target/wasm32-unknown-unknown/release/provider_integrity.wasm
    - name: records_integrity
      path: ../target/wasm32-unknown-unknown/release/records_integrity.wasm
    - name: prescriptions_integrity
      path: ../target/wasm32-unknown-unknown/release/prescriptions_integrity.wasm
    - name: medication_activation_integrity
      path: ../target/wasm32-unknown-unknown/release/medication_activation_integrity.wasm
    - name: medication_emergency_integrity
      path: ../target/wasm32-unknown-unknown/release/medication_emergency_integrity.wasm
    - name: medication_dispense_integrity
      path: ../target/wasm32-unknown-unknown/release/medication_dispense_integrity.wasm
    - name: consent_integrity
      path: ../target/wasm32-unknown-unknown/release/consent_integrity.wasm
    - name: bridge_integrity
      path: ../target/wasm32-unknown-unknown/release/bridge_integrity.wasm
coordinator:
  zomes:
    - name: patient
      path: ../target/wasm32-unknown-unknown/release/patient.wasm
      dependencies:
        - name: patient_integrity
    - name: provider
      path: ../target/wasm32-unknown-unknown/release/provider.wasm
      dependencies:
        - name: provider_integrity
    - name: records
      path: ../target/wasm32-unknown-unknown/release/records.wasm
      dependencies:
        - name: records_integrity
        - name: patient_integrity
        - name: consent_integrity
    - name: prescriptions
      path: ../target/wasm32-unknown-unknown/release/prescriptions.wasm
      dependencies:
        - name: prescriptions_integrity
        - name: patient_integrity
        - name: provider_integrity
    - name: medication_activation
      path: ../target/wasm32-unknown-unknown/release/medication_activation.wasm
      dependencies:
        - name: medication_activation_integrity
    - name: medication_emergency
      path: ../target/wasm32-unknown-unknown/release/medication_emergency.wasm
      dependencies:
        - name: medication_emergency_integrity
    - name: medication_dispense
      path: ../target/wasm32-unknown-unknown/release/medication_dispense.wasm
      dependencies:
        - name: medication_dispense_integrity
    - name: consent
      path: ../target/wasm32-unknown-unknown/release/consent.wasm
      dependencies:
        - name: consent_integrity
        - name: patient_integrity
    - name: bridge
      path: ../target/wasm32-unknown-unknown/release/health_bridge.wasm
      dependencies:
        - name: bridge_integrity
        - name: patient_integrity
        - name: provider_integrity
        - name: records_integrity
