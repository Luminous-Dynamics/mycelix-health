[package]
name = "hdc-genetics-sweettest"
version = "0.1.0"
edition = "2021"
publish = false
description = "Sweettest integration tests for HDC Genetics zome"

[dependencies]
# Holochain test framework
holochain = { version = "0.6.0", default-features = false, features = ["test_utils"] }
hdk = "0.6.0"
holo_hash = "=0.6.1"
holochain_zome_types = "=0.6.1"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Exact accountant qualification types
mycelix-clinical-integrity = { path = "../../crates/clinical-integrity" }
mycelix-clinical-population-release = { path = "../../crates/clinical-population-release" }
mycelix-clinical-population-accountant-canonical-state = { path = "../../crates/clinical-population-accountant-canonical-state" }
population_accountant_integrity = { path = "../../zomes/population_accountant/integrity" }
population_accountant_index = { path = "../../zomes/population_accountant_index/coordinator" }
population_accountant_index_integrity = { path = "../../zomes/population_accountant_index/integrity" }

# Utilities
anyhow = "1.0"

[[test]]
name = "hdc_genetics"
path = "tests/hdc_genetics.rs"

[[test]]
name = "fhir_bridge"
path = "tests/fhir_bridge.rs"

[[test]]
name = "consent_ownership"
path = "tests/consent_ownership.rs"

[[test]]
name = "fhir_integration"
path = "tests/fhir_integration.rs"

[[test]]
name = "cds_safety"
path = "tests/cds_safety.rs"

[[test]]
name = "population_accountant_qualification"
path = "tests/population_accountant_qualification.rs"
