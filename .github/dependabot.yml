# Dependabot configuration for Mycelix Health
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Rust dependencies (Cargo) — INTENTIONALLY DISABLED.
  #
  # This repo has 4 Cargo dependencies (mycelix-bridge-common, mycelix-leptos-core,
  # mycelix-fl, mycelix-zkp-core) that resolve via relative paths reaching outside
  # the repo root into the parent `mycelix` repo (see CONTRACT.md's "Building this
  # repo standalone" section) — real, intended design, since this repo is meant to
  # be consumed as `mycelix`'s `mycelix-health` submodule. Dependabot fetches every
  # path-dependency manifest up front to build its full graph, before it ever gets
  # to per-dependency `ignore` rules, so it fails outright on file-fetching with
  # "The following path based dependencies could not be retrieved" — an `ignore:`
  # list cannot fix this, since the failure happens before ignore rules apply.
  # Re-enable only if these path deps are ever replaced with versioned crates.io
  # dependencies.

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "Luminous-Dynamics/maintainers"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    groups:
      # Bundle Actions bumps into one PR per cycle instead of one per action.
      # Without this, four separate PRs accumulated (setup-node, cache,
      # checkout, install-nix-action) for what is a single routine review --
      # and across the org 58% of all open PRs were Dependabot noise, which
      # buries real work and makes repos read as unattended.
      #
      # Major bumps are deliberately NOT excluded here, unlike symthaea's
      # config: for GitHub Actions a major bump is almost always just a Node
      # runtime refresh (checkout v4 -> v7), not a breaking API change, so
      # reviewing them together is appropriate. Cargo majors are a different
      # matter -- but this repo's cargo ecosystem is disabled above anyway.
      actions-updates:
        applies-to: version-updates
        patterns:
          - "*"
