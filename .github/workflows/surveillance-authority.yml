name: Public Health Surveillance Authority

on:
  # Permit stacked PRs while the evidence/publication prerequisites are drafts.
  pull_request:
    paths:
      - "crates/health-surveillance-core/**"
      - "crates/health-surveillance-authority/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/surveillance-authority.yml"
  push:
    branches: [main]
    paths:
      - "crates/health-surveillance-core/**"
      - "crates/health-surveillance-authority/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/surveillance-authority.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  authority-contract:
    name: Canonical producer-authority qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cargo resolves the whole mycelix-health workspace, including sibling
      # path dependencies expected from the parent mycelix checkout.
      - name: Check out parent workspace dependencies
        run: |
          git clone --depth 1 https://github.com/Luminous-Dynamics/mycelix.git /tmp/mycelix-parent
          mkdir -p ../crates ../mycelix-core ../mycelix-workspace/mycelix-core
          cp -r /tmp/mycelix-parent/crates/. ../crates/
          cp -r /tmp/mycelix-parent/mycelix-core/. ../mycelix-core/
          cp -r /tmp/mycelix-parent/mycelix-core/. ../mycelix-workspace/mycelix-core/
          rm -rf /tmp/mycelix-parent

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Resolve host target
        id: host
        shell: bash
        run: echo "triple=$(rustc -vV | awk '/^host:/{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: cargo fmt -p health-surveillance-authority -- --check

      - name: Run host tests
        run: cargo test -p health-surveillance-authority --target "${{ steps.host.outputs.triple }}"

      - name: Run host Clippy
        run: cargo clippy -p health-surveillance-authority --all-targets --target "${{ steps.host.outputs.triple }}" -- -D warnings

      - name: Run doc tests
        run: cargo test -p health-surveillance-authority --doc --target "${{ steps.host.outputs.triple }}"

      - name: Check WASM compatibility
        run: cargo check -p health-surveillance-authority --target wasm32-unknown-unknown
