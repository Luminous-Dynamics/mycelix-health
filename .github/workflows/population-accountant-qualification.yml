name: Population Accountant Qualification

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/population-accountant-qualification.yml'
      - 'Cargo.toml'
      - 'dna/**'
      - 'crates/clinical-integrity/**'
      - 'crates/clinical-population-release/**'
      - 'crates/clinical-population-accountant-state/**'
      - 'crates/clinical-population-accountant-canonical-state/**'
      - 'zomes/population_accountant/**'
      - 'zomes/population_accountant_index/**'
      - 'tests/sweettest/Cargo.toml'
      - 'tests/sweettest/tests/population_accountant_qualification.rs'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  accountant-conductor:
    name: Accountant Conductor Qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repository is normally the mycelix-health submodule of the parent
      # mycelix repository. Recreate the same sibling paths as the ordinary CI lane.
      - name: Check out parent sibling crates
        run: |
          git clone --depth 1 https://github.com/Luminous-Dynamics/mycelix.git /tmp/mycelix-parent
          mkdir -p ../crates ../mycelix-core ../mycelix-workspace/mycelix-core
          cp -r /tmp/mycelix-parent/crates/. ../crates/
          cp -r /tmp/mycelix-parent/mycelix-core/. ../mycelix-core/
          cp -r /tmp/mycelix-parent/mycelix-core/. ../mycelix-workspace/mycelix-core/
          rm -rf /tmp/mycelix-parent

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Holochain
        uses: holochain/holochain-nix-setup-action@v1

      - name: Build exact WASM workspace and pack DNA
        run: |
          nix develop --command bash -euo pipefail -c '
            cargo build --workspace --target wasm32-unknown-unknown --release
            hc dna pack dna/ -o dna/health.dna
            test -s dna/health.dna
          '

      - name: Execute accountant conductor qualification
        run: |
          nix develop --command bash -euo pipefail -c '
            HOST="$(rustc -vV | awk "/^host:/{print \$2}")"
            cargo test \
              --manifest-path tests/sweettest/Cargo.toml \
              --test population_accountant_qualification \
              --target "$HOST" \
              -- --nocapture
          '
