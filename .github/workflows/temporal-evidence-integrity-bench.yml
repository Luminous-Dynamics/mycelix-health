name: Temporal Evidence Integrity Benchmark
on:
  pull_request:
    branches: [main]
    paths:
      - 'prototypes/temporal-evidence-integrity-bench/**'
      - '.github/workflows/temporal-evidence-integrity-bench.yml'
  push:
    branches: [main]
    paths:
      - 'prototypes/temporal-evidence-integrity-bench/**'
      - '.github/workflows/temporal-evidence-integrity-bench.yml'

permissions:
  contents: read

jobs:
  qualify:
    name: Temporal evidence benchmark (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Verify fixture digests
        run: |
          sha256sum prototypes/temporal-evidence-integrity-bench/fixtures/v1-events.tsv
          sha256sum prototypes/temporal-evidence-integrity-bench/fixtures/v1-cases.tsv
          sha256sum prototypes/temporal-evidence-integrity-bench/fixtures/v1-answer-key-events.tsv
      - name: Check formatting
        run: cargo fmt --manifest-path prototypes/temporal-evidence-integrity-bench/Cargo.toml -- --check
      - name: Run clippy
        run: |
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          cargo clippy --manifest-path prototypes/temporal-evidence-integrity-bench/Cargo.toml --target "$HOST" --all-targets -- -D warnings
      - name: Run tests
        run: |
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          cargo test --manifest-path prototypes/temporal-evidence-integrity-bench/Cargo.toml --target "$HOST"
