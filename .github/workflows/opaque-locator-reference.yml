name: Opaque Locator Reference

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/opaque-locator-core/**'
      - '.github/workflows/opaque-locator-reference.yml'
  push:
    branches:
      - 'feat/opaque-locator-core-v1'
    paths:
      - 'crates/opaque-locator-core/**'
      - '.github/workflows/opaque-locator-reference.yml'

permissions:
  contents: read

jobs:
  qualify-opaque-locator-semantics:
    name: Qualify opaque locator / protected manifest semantics
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/opaque-locator-core
    steps:
      - name: Check out exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
          rustc +1.96.0 -Vv
          cargo +1.96.0 -V

      - name: Freeze preflight identities
        run: |
          git rev-parse HEAD | tee /tmp/subject.sha
          sha256sum Cargo.toml Cargo.lock src/lib.rs README.md | tee /tmp/locator.before.sha256
          cargo +1.96.0 metadata --locked --no-deps --format-version 1 > /tmp/locator.metadata.json
          test "$(jq -r '.packages | length' /tmp/locator.metadata.json)" = "1"
          test "$(jq -r '.packages[0].name' /tmp/locator.metadata.json)" = "mycelix-opaque-locator-core"

      - name: Check formatting
        run: cargo +1.96.0 fmt -- --check

      - name: Run tests
        run: cargo +1.96.0 test --locked

      - name: Run Clippy
        run: cargo +1.96.0 clippy --locked --all-targets -- -D warnings

      - name: Verify postflight immutability
        run: |
          test "$(git rev-parse HEAD)" = "$(cat /tmp/subject.sha)"
          sha256sum Cargo.toml Cargo.lock src/lib.rs README.md > /tmp/locator.after.sha256
          diff -u /tmp/locator.before.sha256 /tmp/locator.after.sha256
          git diff --exit-code -- Cargo.toml Cargo.lock src/lib.rs README.md

      - name: Evidence summary
        if: always()
        run: |
          {
            echo '## Opaque locator reference evidence'
            echo
            echo "- subject: $(git rev-parse HEAD)"
            echo "- runner: ubuntu-24.04"
            echo "- rustc: $(rustc +1.96.0 --version)"
            echo "- cargo: $(cargo +1.96.0 --version)"
            echo '- scope: locator/grant/manifest/rotation semantics only'
            echo '- invariant: public edge contains only opaque locator -> manifest envelope'
            echo '- invariant: locator reuse across authorization contexts is rejected'
            echo '- invariant: rotation preserves authority context and cannot extend expiry'
            echo '- non-claim: no encryption/randomness/unlinkability/Holochain/regulatory qualification'
          } >> "$GITHUB_STEP_SUMMARY"
