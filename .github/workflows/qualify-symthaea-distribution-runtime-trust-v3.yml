name: Qualify Symthaea Distribution Runtime Trust V3

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: qualify-symthaea-runtime-trust-v3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  MYCELIX_PARENT_SHA: a85369699099d4c7524e502e531735eed4ab36f4
  CHECKOUT_ACTION_SHA: 11d5960a326750d5838078e36cf38b85af677262
  INSTALL_NIX_ACTION_SHA: 6004951b182f8860210c8d6f0d808ec5b1a33d28
  UPLOAD_ARTIFACT_ACTION_SHA: ea165f8d65b6e75b540449e92b4886f43607fa02

jobs:
  qualify:
    name: Exact-head v3 qualification
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'integration/symthaea-clinical-distribution-runtime-trust-v3'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact subject with full ancestry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact subject and required proof-line ancestry
        shell: bash
        run: |
          set -euo pipefail
          actual_subject="$(git rev-parse HEAD)"
          test "$actual_subject" = "$SUBJECT_SHA"

          ASSERTION_HEAD=469f3e75f6b2b2905956657ab549e7bfdd4962ec
          CURRENTNESS_HEAD=2c89b88f949a9d013b4f190e071a690c978cea4d
          INTEGRATION_HEAD=50d5ac4aca63dce737f1f2bb91a0dce530038b33

          for sha in "$ASSERTION_HEAD" "$CURRENTNESS_HEAD" "$INTEGRATION_HEAD"; do
            git cat-file -e "${sha}^{commit}"
            git merge-base --is-ancestor "$sha" HEAD
          done

          expected_parents="$ASSERTION_HEAD $CURRENTNESS_HEAD"
          actual_parents="$(git show -s --format=%P "$INTEGRATION_HEAD")"
          test "$actual_parents" = "$expected_parents"

          test -f crates/symthaea-clinical-distribution-trust-v3/Cargo.toml
          test -f crates/symthaea-clinical-distribution-trust-v3/src/lib.rs
          test -f crates/symthaea-clinical-distribution-trust-v3/tests/runtime_trust.rs
          test -f docs/security/SYMTHAEA_CLINICAL_DISTRIBUTION_RUNTIME_TRUST_V3_QUALIFICATION.md

          echo "Qualification subject: $actual_subject"
          echo "Integration parents: $actual_parents"

      - name: Check out pinned parent Mycelix dependency snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Luminous-Dynamics/mycelix
          ref: ${{ env.MYCELIX_PARENT_SHA }}
          path: _qualification/mycelix-parent
          fetch-depth: 1
          persist-credentials: false

      - name: Verify and install pinned sibling dependencies
        shell: bash
        run: |
          set -euo pipefail
          actual_parent="$(git -C _qualification/mycelix-parent rev-parse HEAD)"
          test "$actual_parent" = "$MYCELIX_PARENT_SHA"
          parent_tree="$(git -C _qualification/mycelix-parent rev-parse 'HEAD^{tree}')"
          echo "MYCELIX_PARENT_TREE=$parent_tree" >> "$GITHUB_ENV"

          rm -rf ../crates ../mycelix-core ../mycelix-workspace/mycelix-core
          mkdir -p ../crates ../mycelix-core ../mycelix-workspace/mycelix-core
          cp -r _qualification/mycelix-parent/crates/. ../crates/
          cp -r _qualification/mycelix-parent/mycelix-core/. ../mycelix-core/
          cp -r _qualification/mycelix-parent/mycelix-core/. ../mycelix-workspace/mycelix-core/

          test -f ../crates/mycelix-bridge-common/Cargo.toml
          test -f ../crates/mycelix-leptos-core/Cargo.toml
          test -f ../crates/mycelix-zkp-core/Cargo.toml
          test -f ../mycelix-core/libs/mycelix-fl/Cargo.toml

          echo "Pinned parent Mycelix: $actual_parent"
          echo "Pinned parent tree: $parent_tree"

      - name: Install pinned Nix bootstrap
        uses: cachix/install-nix-action@6004951b182f8860210c8d6f0d808ec5b1a33d28
        with:
          install_url: https://releases.nixos.org/nix/nix-2.19.2/install
          enable_kvm: false

      - name: Freeze execution-environment inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification-evidence
          git diff --exit-code -- Cargo.lock flake.lock rust-toolchain.toml

          sha256sum Cargo.lock > qualification-evidence/Cargo.lock.sha256
          sha256sum flake.lock > qualification-evidence/flake.lock.sha256
          sha256sum rust-toolchain.toml > qualification-evidence/rust-toolchain.toml.sha256

          nix flake metadata --json --no-write-lock-file > qualification-evidence/flake-metadata.json
          nix eval --raw --no-write-lock-file .#devShells.x86_64-linux.ci.drvPath \
            > qualification-evidence/ci-dev-shell.drv

          nix develop --no-write-lock-file .#ci --command rustc -vV \
            > qualification-evidence/rustc-vV.txt
          nix develop --no-write-lock-file .#ci --command cargo -vV \
            > qualification-evidence/cargo-vV.txt

          sha256sum -c qualification-evidence/Cargo.lock.sha256
          sha256sum -c qualification-evidence/flake.lock.sha256
          sha256sum -c qualification-evidence/rust-toolchain.toml.sha256
          git diff --exit-code -- Cargo.lock flake.lock rust-toolchain.toml

      - name: Require frozen lock-consistent workspace
        shell: bash
        run: |
          set -euo pipefail
          nix develop --no-write-lock-file .#ci --command \
            cargo metadata --locked --no-deps --format-version 1 \
            > qualification-evidence/cargo-metadata.json
          jq -e '.packages[] | select(.name == "mycelix-symthaea-clinical-distribution-trust-v3")' \
            qualification-evidence/cargo-metadata.json >/dev/null

          sha256sum -c qualification-evidence/Cargo.lock.sha256
          sha256sum -c qualification-evidence/flake.lock.sha256
          git diff --exit-code -- Cargo.lock flake.lock rust-toolchain.toml

      - name: Check focused formatting
        run: |
          nix develop --no-write-lock-file .#ci --command \
            cargo fmt --package mycelix-symthaea-clinical-distribution-trust-v3 -- --check

      - name: Check focused host clippy
        shell: bash
        run: |
          set -euo pipefail
          HOST="$(nix develop --no-write-lock-file .#ci --command rustc -vV | awk '/^host:/{print $2}')"
          nix develop --no-write-lock-file .#ci --command \
            cargo clippy \
              --locked \
              -p mycelix-symthaea-clinical-distribution-trust-v3 \
              --all-targets \
              --target "$HOST" \
              -- -D warnings

      - name: Check focused WASM build surface
        run: |
          nix develop --no-write-lock-file .#ci --command \
            cargo check --locked \
              -p mycelix-symthaea-clinical-distribution-trust-v3 \
              --target wasm32-unknown-unknown

      - name: Run assertion-native runtime-trust tests
        shell: bash
        run: |
          set -euo pipefail
          HOST="$(nix develop --no-write-lock-file .#ci --command rustc -vV | awk '/^host:/{print $2}')"
          nix develop --no-write-lock-file .#ci --command \
            cargo test \
              --locked \
              -p mycelix-symthaea-clinical-distribution-trust-v3 \
              --target "$HOST"

      - name: Run prerequisite proof-line tests
        shell: bash
        run: |
          set -euo pipefail
          HOST="$(nix develop --no-write-lock-file .#ci --command rustc -vV | awk '/^host:/{print $2}')"
          nix develop --no-write-lock-file .#ci --command \
            cargo test \
              --locked \
              -p mycelix-symthaea-clinical-distribution-assessment-v2 \
              -p mycelix-clinical-distribution-currentness \
              -p clinical_distribution_trust_integrity \
              -p clinical_distribution_trust \
              -p clinical_distribution_lease_integrity \
              -p clinical_distribution_lease \
              --target "$HOST"

      - name: Verify subject and environment immutability postflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          sha256sum -c qualification-evidence/Cargo.lock.sha256
          sha256sum -c qualification-evidence/flake.lock.sha256
          sha256sum -c qualification-evidence/rust-toolchain.toml.sha256
          git diff --exit-code

      - name: Record exact qualification identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "subject_sha=$(git rev-parse HEAD)"
            echo "event_subject_sha=$SUBJECT_SHA"
            echo "assertion_head=469f3e75f6b2b2905956657ab549e7bfdd4962ec"
            echo "currentness_head=2c89b88f949a9d013b4f190e071a690c978cea4d"
            echo "integration_head=50d5ac4aca63dce737f1f2bb91a0dce530038b33"
            echo "mycelix_parent_sha=$MYCELIX_PARENT_SHA"
            echo "mycelix_parent_tree=$MYCELIX_PARENT_TREE"
            echo "cargo_lock_sha256=$(awk '{print $1}' qualification-evidence/Cargo.lock.sha256)"
            echo "flake_lock_sha256=$(awk '{print $1}' qualification-evidence/flake.lock.sha256)"
            echo "rust_toolchain_file_sha256=$(awk '{print $1}' qualification-evidence/rust-toolchain.toml.sha256)"
            echo "ci_dev_shell_drv=$(cat qualification-evidence/ci-dev-shell.drv)"
            echo "checkout_action_sha=$CHECKOUT_ACTION_SHA"
            echo "install_nix_action_sha=$INSTALL_NIX_ACTION_SHA"
            echo "upload_artifact_action_sha=$UPLOAD_ARTIFACT_ACTION_SHA"
            echo "nix_version=$(nix --version)"
            echo "rustc_version=$(nix develop --no-write-lock-file .#ci --command rustc --version)"
            echo "cargo_version=$(nix develop --no-write-lock-file .#ci --command cargo --version)"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "runner_image_os=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
            echo "execution_environment_authority=FlakeLockBound"
            echo "runner_identity_role=TransportFingerprintOnly"
          } | tee qualification-evidence/identity.txt | tee -a "$GITHUB_STEP_SUMMARY"

          echo "A green job is software qualification evidence only; it is not clinical validation or clinical authority." \
            | tee -a qualification-evidence/identity.txt

      - name: Upload qualification evidence capsule
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: symthaea-distribution-runtime-trust-v3-qualification-evidence
          path: qualification-evidence/
          if-no-files-found: error
          retention-days: 30
