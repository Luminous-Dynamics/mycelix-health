name: Qualify Symthaea Distribution Runtime Trust V3

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  MYCELIX_PARENT_SHA: a85369699099d4c7524e502e531735eed4ab36f4

jobs:
  qualify:
    name: Exact-head v3 qualification
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact subject with full ancestry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify required proof-line ancestry
        shell: bash
        run: |
          set -euo pipefail
          ASSERTION_HEAD=469f3e75f6b2b2905956657ab549e7bfdd4962ec
          CURRENTNESS_HEAD=2c89b88f949a9d013b4f190e071a690c978cea4d
          INTEGRATION_HEAD=50d5ac4aca63dce737f1f2bb91a0dce530038b33

          for sha in "$ASSERTION_HEAD" "$CURRENTNESS_HEAD" "$INTEGRATION_HEAD"; do
            git cat-file -e "${sha}^{commit}"
            git merge-base --is-ancestor "$sha" HEAD
          done

          expected_parents="$ASSERTION_HEAD $CURRENTNESS_HEAD"
          actual_parents="$(git show -s --format=%P "$INTEGRATION_HEAD")"
          test "$actual_parents" = "$expected_parents"

          test -f crates/symthaea-clinical-distribution-trust-v3/Cargo.toml
          test -f crates/symthaea-clinical-distribution-trust-v3/src/lib.rs
          test -f crates/symthaea-clinical-distribution-trust-v3/tests/runtime_trust.rs
          test -f docs/security/SYMTHAEA_CLINICAL_DISTRIBUTION_RUNTIME_TRUST_V3_QUALIFICATION.md

          echo "Qualification subject: $(git rev-parse HEAD)"
          echo "Integration parents: $actual_parents"

      - name: Check out pinned parent Mycelix dependency snapshot
        uses: actions/checkout@v4
        with:
          repository: Luminous-Dynamics/mycelix
          ref: ${{ env.MYCELIX_PARENT_SHA }}
          path: _qualification/mycelix-parent
          fetch-depth: 1
          persist-credentials: false

      - name: Verify and install pinned sibling dependencies
        shell: bash
        run: |
          set -euo pipefail
          actual_parent="$(git -C _qualification/mycelix-parent rev-parse HEAD)"
          test "$actual_parent" = "$MYCELIX_PARENT_SHA"
          parent_tree="$(git -C _qualification/mycelix-parent rev-parse 'HEAD^{tree}')"
          echo "MYCELIX_PARENT_TREE=$parent_tree" >> "$GITHUB_ENV"

          rm -rf ../crates ../mycelix-core ../mycelix-workspace/mycelix-core
          mkdir -p ../crates ../mycelix-core ../mycelix-workspace/mycelix-core
          cp -r _qualification/mycelix-parent/crates/. ../crates/
          cp -r _qualification/mycelix-parent/mycelix-core/. ../mycelix-core/
          cp -r _qualification/mycelix-parent/mycelix-core/. ../mycelix-workspace/mycelix-core/

          test -f ../crates/mycelix-bridge-common/Cargo.toml
          test -f ../crates/mycelix-leptos-core/Cargo.toml
          test -f ../crates/mycelix-zkp-core/Cargo.toml
          test -f ../mycelix-core/libs/mycelix-fl/Cargo.toml

          echo "Pinned parent Mycelix: $actual_parent"
          echo "Pinned parent tree: $parent_tree"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Require frozen lock-consistent workspace
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- Cargo.lock
          sha256sum Cargo.lock > /tmp/qualify-cargo-lock.sha256
          cargo metadata --locked --no-deps --format-version 1 \
            | jq -e '.packages[] | select(.name == "mycelix-symthaea-clinical-distribution-trust-v3")' >/dev/null
          sha256sum -c /tmp/qualify-cargo-lock.sha256
          git diff --exit-code -- Cargo.lock

      - name: Check focused formatting
        run: cargo fmt --package mycelix-symthaea-clinical-distribution-trust-v3 -- --check

      - name: Check focused host clippy
        shell: bash
        run: |
          set -euo pipefail
          HOST="$(rustc -vV | awk '/^host:/{print $2}')"
          cargo clippy \
            --locked \
            -p mycelix-symthaea-clinical-distribution-trust-v3 \
            --all-targets \
            --target "$HOST" \
            -- -D warnings

      - name: Check focused WASM build surface
        run: cargo check --locked -p mycelix-symthaea-clinical-distribution-trust-v3 --target wasm32-unknown-unknown

      - name: Run assertion-native runtime-trust tests
        shell: bash
        run: |
          set -euo pipefail
          HOST="$(rustc -vV | awk '/^host:/{print $2}')"
          cargo test \
            --locked \
            -p mycelix-symthaea-clinical-distribution-trust-v3 \
            --target "$HOST"

      - name: Run prerequisite proof-line tests
        shell: bash
        run: |
          set -euo pipefail
          HOST="$(rustc -vV | awk '/^host:/{print $2}')"
          cargo test \
            --locked \
            -p mycelix-symthaea-clinical-distribution-assessment-v2 \
            -p mycelix-clinical-distribution-currentness \
            -p clinical_distribution_trust_integrity \
            -p clinical_distribution_trust \
            -p clinical_distribution_lease_integrity \
            -p clinical_distribution_lease \
            --target "$HOST"

      - name: Verify lockfile immutability postflight
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c /tmp/qualify-cargo-lock.sha256
          git diff --exit-code -- Cargo.lock

      - name: Record exact qualification identity
        shell: bash
        run: |
          set -euo pipefail
          lock_sha="$(sha256sum Cargo.lock | awk '{print $1}')"
          {
            echo "subject_sha=$(git rev-parse HEAD)"
            echo "assertion_head=469f3e75f6b2b2905956657ab549e7bfdd4962ec"
            echo "currentness_head=2c89b88f949a9d013b4f190e071a690c978cea4d"
            echo "integration_head=50d5ac4aca63dce737f1f2bb91a0dce530038b33"
            echo "mycelix_parent_sha=$MYCELIX_PARENT_SHA"
            echo "mycelix_parent_tree=$MYCELIX_PARENT_TREE"
            echo "cargo_lock_sha256=$lock_sha"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "A green job is software qualification evidence only; it is not clinical validation or clinical authority."