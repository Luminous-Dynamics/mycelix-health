name: SDK Sodium Lockfile Refresh

on:
  push:
    branches: [fix/zome-license-workspace-inheritance-2026-11-26]
    paths:
      - "sdk/package.json"
      - ".github/workflows/sdk-sodium-lock-refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: health-sdk-sodium-lock-refresh
  cancel-in-progress: false

jobs:
  refresh-lock:
    name: Resolve exact libsodium wrapper pin
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout the owned remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/zome-license-workspace-inheritance-2026-11-26
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - name: Refresh only the SDK lockfile from the exact override
        working-directory: sdk
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=commonjs -e '
            const lock = require("./package-lock.json");
            const entries = Object.entries(lock.packages || {})
              .filter(([name]) => name.endsWith("node_modules/libsodium-wrappers"));
            if (entries.length === 0) throw new Error("libsodium-wrappers missing from SDK lockfile");
            for (const [name, pkg] of entries) {
              if (pkg.version !== "0.7.13") {
                throw new Error(name + " resolved " + pkg.version + "; expected exact 0.7.13");
              }
              console.log(name + "=" + pkg.version);
            }
          '

      - name: Verify the lockfile can be installed without lifecycle scripts
        working-directory: sdk
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Record resolved package identity
        working-directory: sdk
        run: |
          node -e '
            const p = require("./node_modules/libsodium-wrappers/package.json");
            if (p.version !== "0.7.13") throw new Error("unexpected installed wrapper " + p.version);
            console.log(JSON.stringify({name:p.name, version:p.version}, null, 2));
          ' | tee "$RUNNER_TEMP/libsodium-wrapper-version.json"

      - name: Preserve lockfile evidence
        uses: actions/upload-artifact@v4
        with:
          name: health-sdk-libsodium-lock
          path: |
            sdk/package-lock.json
            ${{ runner.temp }}/libsodium-wrapper-version.json
          if-no-files-found: error
          retention-days: 90

      - name: Commit the lockfile to the owned branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sdk/package-lock.json
          if git diff --cached --quiet; then
            echo "SDK lockfile already records the exact wrapper pin."
          else
            git commit -m "chore(sdk): lock libsodium-wrappers 0.7.13"
            git push origin HEAD:fix/zome-license-workspace-inheritance-2026-11-26
          fi
