name: Qualification Adapter Profile Reference

on:
  pull_request:
    branches:
      - 'feat/qualification-receipt-core-v1'
    paths:
      - 'crates/qualification-receipt-core/**'
      - 'crates/qualification-adapter-profile-core/**'
      - '.github/workflows/qualification-adapter-profile-reference.yml'
  push:
    branches:
      - 'feat/qualification-adapter-profiles-v1'
    paths:
      - 'crates/qualification-receipt-core/**'
      - 'crates/qualification-adapter-profile-core/**'
      - '.github/workflows/qualification-adapter-profile-reference.yml'

permissions:
  contents: read

jobs:
  qualify-adapter-profile-semantics:
    name: Qualify governed receipt -> #208 adapter profile semantics
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/qualification-adapter-profile-core
    steps:
      - name: Check out exact stacked subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
          rustc +1.96.0 -Vv
          cargo +1.96.0 -V

      - name: Freeze preflight identities
        run: |
          git rev-parse HEAD | tee /tmp/subject.sha
          sha256sum \
            Cargo.toml Cargo.lock README.md BOUNDARIES.md SOURCE_STATUS.md src/lib.rs \
            ../qualification-receipt-core/Cargo.toml \
            ../qualification-receipt-core/Cargo.lock \
            ../qualification-receipt-core/src/lib.rs \
            ../qualification-receipt-core/src/model.rs \
            ../qualification-receipt-core/src/strict.rs \
            ../qualification-receipt-core/src/scoped.rs \
            | tee /tmp/adapter.before.sha256
          cargo +1.96.0 metadata --locked --no-deps --format-version 1 > /tmp/adapter.metadata.json
          test "$(jq -r '.packages | length' /tmp/adapter.metadata.json)" = "1"
          test "$(jq -r '.packages[0].name' /tmp/adapter.metadata.json)" = "mycelix-qualification-adapter-profile-core"

      - name: Static seam guards
        run: |
          grep -q 'Patient208CompositionCommitment' src/lib.rs
          grep -q 'CompositionCommitmentQualification' src/lib.rs
          grep -q 'AdmissionScope::Cutover' src/lib.rs
          grep -q 'VerifiedLineageHead' src/lib.rs
          grep -q 'ReceiptNotCurrentHead' src/lib.rs
          grep -q 'ReceiptNotAdmissible' src/lib.rs
          grep -q 'ClockRollback' src/lib.rs
          grep -q 'Profile208CompositionCommitmentToken' src/lib.rs
          grep -q 'pub fn kind(&self)' ../qualification-receipt-core/src/scoped.rs
          grep -q 'pub fn deployment_evidence(&self)' ../qualification-receipt-core/src/scoped.rs
          grep -q 'pub fn issued_at_micros(&self)' ../qualification-receipt-core/src/scoped.rs
          grep -q 'pub fn expires_at_micros(&self)' ../qualification-receipt-core/src/scoped.rs
          grep -q 'SOURCE-STAGED / UNEXECUTED' SOURCE_STATUS.md
          grep -q 'current lineage head' README.md
          ! grep -R -n 'AnyQualification' src ../qualification-receipt-core/src
          ! grep -R -n 'pub fn convert_profile208' src

      - name: Check parent receipt-core formatting
        run: cargo +1.96.0 fmt --manifest-path ../qualification-receipt-core/Cargo.toml -- --check

      - name: Test parent receipt core
        run: cargo +1.96.0 test --locked --manifest-path ../qualification-receipt-core/Cargo.toml

      - name: Clippy parent receipt core
        run: cargo +1.96.0 clippy --locked --manifest-path ../qualification-receipt-core/Cargo.toml --all-targets -- -D warnings

      - name: Check adapter formatting
        run: cargo +1.96.0 fmt -- --check

      - name: Test adapter profile core
        run: cargo +1.96.0 test --locked

      - name: Clippy adapter profile core
        run: cargo +1.96.0 clippy --locked --all-targets -- -D warnings

      - name: Verify postflight immutability
        run: |
          test "$(git rev-parse HEAD)" = "$(cat /tmp/subject.sha)"
          sha256sum \
            Cargo.toml Cargo.lock README.md BOUNDARIES.md SOURCE_STATUS.md src/lib.rs \
            ../qualification-receipt-core/Cargo.toml \
            ../qualification-receipt-core/Cargo.lock \
            ../qualification-receipt-core/src/lib.rs \
            ../qualification-receipt-core/src/model.rs \
            ../qualification-receipt-core/src/strict.rs \
            ../qualification-receipt-core/src/scoped.rs \
            > /tmp/adapter.after.sha256
          diff -u /tmp/adapter.before.sha256 /tmp/adapter.after.sha256
          git diff --exit-code -- \
            Cargo.toml Cargo.lock README.md BOUNDARIES.md SOURCE_STATUS.md src/lib.rs \
            ../qualification-receipt-core/Cargo.toml \
            ../qualification-receipt-core/Cargo.lock \
            ../qualification-receipt-core/src/lib.rs \
            ../qualification-receipt-core/src/model.rs \
            ../qualification-receipt-core/src/strict.rs \
            ../qualification-receipt-core/src/scoped.rs

      - name: Evidence summary
        if: always()
        run: |
          {
            echo '## Qualification adapter profile reference evidence'
            echo
            echo "- subject: $(git rev-parse HEAD)"
            echo "- parent receipt head: d152003d8ba4040a7b8f3bbfd259c4f5ae71bd9e"
            echo "- runner: ubuntu-24.04"
            echo "- rustc: $(rustc +1.96.0 --version)"
            echo "- cargo: $(cargo +1.96.0 --version)"
            echo '- scope: exact governed receipt -> Profile208CompositionCommitmentToken conversion semantics only'
            echo '- invariant: receipt kind/binding/policy/trust/deployment must exactly match the #208 profile'
            echo '- invariant: local active status alone is insufficient; exact verified lineage head is required'
            echo '- invariant: seam consumption time is monotonic within the reference gate'
            echo '- invariant: no AnyQualification or stateless public conversion escape hatch'
            echo '- non-claim: no signature/profile/checkpoint/trusted-time/persistence/#208-product integration qualification'
          } >> "$GITHUB_STEP_SUMMARY"
