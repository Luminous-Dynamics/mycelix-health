name: Prepare Clinical Assurance Lock Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - flake.nix
      - flake.lock
      - rust-toolchain.toml
      - 'crates/**/Cargo.toml'
      - 'zomes/**/Cargo.toml'
      - '.github/workflows/prepare-clinical-assurance-lock-candidate.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  MYCELIX_PARENT_SHA: a85369699099d4c7524e502e531735eed4ab36f4
  CHECKOUT_ACTION_SHA: 11d5960a326750d5838078e36cf38b85af677262
  INSTALL_NIX_ACTION_SHA: 6004951b182f8860210c8d6f0d808ec5b1a33d28
  UPLOAD_ARTIFACT_ACTION_SHA: ea165f8d65b6e75b540449e92b4886f43607fa02

jobs:
  candidate:
    name: Non-authoritative lock reconciliation candidate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Check out pinned parent Mycelix dependency snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Luminous-Dynamics/mycelix
          ref: ${{ env.MYCELIX_PARENT_SHA }}
          path: _qualification/mycelix-parent
          fetch-depth: 1
          persist-credentials: false

      - name: Verify and install pinned sibling dependencies
        shell: bash
        run: |
          set -euo pipefail
          actual_parent="$(git -C _qualification/mycelix-parent rev-parse HEAD)"
          test "$actual_parent" = "$MYCELIX_PARENT_SHA"
          parent_tree="$(git -C _qualification/mycelix-parent rev-parse 'HEAD^{tree}')"
          echo "MYCELIX_PARENT_TREE=$parent_tree" >> "$GITHUB_ENV"

          rm -rf ../crates ../mycelix-core ../mycelix-workspace/mycelix-core
          mkdir -p ../crates ../mycelix-core ../mycelix-workspace/mycelix-core
          cp -r _qualification/mycelix-parent/crates/. ../crates/
          cp -r _qualification/mycelix-parent/mycelix-core/. ../mycelix-core/
          cp -r _qualification/mycelix-parent/mycelix-core/. ../mycelix-workspace/mycelix-core/

          test -f ../crates/mycelix-bridge-common/Cargo.toml
          test -f ../crates/mycelix-leptos-core/Cargo.toml
          test -f ../crates/mycelix-zkp-core/Cargo.toml
          test -f ../mycelix-core/libs/mycelix-fl/Cargo.toml

      - name: Install pinned Nix bootstrap
        uses: cachix/install-nix-action@6004951b182f8860210c8d6f0d808ec5b1a33d28
        with:
          install_url: https://releases.nixos.org/nix/nix-2.19.2/install
          enable_kvm: false

      - name: Snapshot committed dependency and environment inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lock-candidate
          cp Cargo.lock lock-candidate/Cargo.lock.before
          cp flake.lock lock-candidate/flake.lock.before
          cp rust-toolchain.toml lock-candidate/rust-toolchain.toml.before
          sha256sum Cargo.lock > lock-candidate/Cargo.lock.before.sha256
          sha256sum flake.lock > lock-candidate/flake.lock.before.sha256
          sha256sum rust-toolchain.toml > lock-candidate/rust-toolchain.toml.before.sha256
          git rev-parse HEAD > lock-candidate/subject-sha.txt

          nix flake metadata --json --no-write-lock-file > lock-candidate/flake-metadata.json
          nix eval --raw --no-write-lock-file .#devShells.x86_64-linux.ci.drvPath \
            > lock-candidate/ci-dev-shell.drv
          nix develop --no-write-lock-file .#ci --command rustc -vV > lock-candidate/rustc-vV.txt
          nix develop --no-write-lock-file .#ci --command cargo -vV > lock-candidate/cargo-vV.txt

          sha256sum -c lock-candidate/flake.lock.before.sha256
          sha256sum -c lock-candidate/rust-toolchain.toml.before.sha256

      - name: Reconcile lock from existing graph inside frozen Nix environment
        shell: bash
        run: |
          set -euo pipefail
          nix develop --no-write-lock-file .#ci --command \
            cargo metadata --no-deps --format-version 1 \
            > lock-candidate/metadata.json

          nix develop --no-write-lock-file .#ci --command \
            cargo metadata --locked --no-deps --format-version 1 \
            > lock-candidate/metadata.locked.json

          jq -e '.packages[] | select(.name == "mycelix-symthaea-clinical-distribution-trust-v3")' \
            lock-candidate/metadata.locked.json >/dev/null

          cp Cargo.lock lock-candidate/Cargo.lock.candidate
          sha256sum Cargo.lock > lock-candidate/Cargo.lock.candidate.sha256
          git diff -- Cargo.lock > lock-candidate/Cargo.lock.diff
          git status --short > lock-candidate/git-status.txt

          sha256sum -c lock-candidate/flake.lock.before.sha256
          sha256sum -c lock-candidate/rust-toolchain.toml.before.sha256
          git diff --exit-code -- flake.lock rust-toolchain.toml

      - name: Audit dependency movement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import tomllib

          root = pathlib.Path('lock-candidate')
          with (root / 'Cargo.lock.before').open('rb') as f:
              before = tomllib.load(f)
          with (root / 'Cargo.lock.candidate').open('rb') as f:
              after = tomllib.load(f)

          def packages(doc):
              return doc.get('package', [])

          def registry_set(doc):
              return {
                  (p['name'], p['version'], p.get('source', ''))
                  for p in packages(doc)
                  if p.get('source', '').startswith('registry+')
              }

          def local_set(doc):
              return {
                  (p['name'], p['version'])
                  for p in packages(doc)
                  if 'source' not in p
              }

          def git_set(doc):
              return {
                  (p['name'], p['version'], p.get('source', ''))
                  for p in packages(doc)
                  if p.get('source', '').startswith('git+')
              }

          def versions_by_name(items):
              out = {}
              for name, version, *_ in items:
                  out.setdefault(name, set()).add(version)
              return {k: sorted(v) for k, v in out.items()}

          before_reg = registry_set(before)
          after_reg = registry_set(after)
          before_local = local_set(before)
          after_local = local_set(after)
          before_git = git_set(before)
          after_git = git_set(after)
          before_versions = versions_by_name(before_reg)
          after_versions = versions_by_name(after_reg)

          changed_registry_versions = {
              name: {
                  'before': before_versions[name],
                  'after': after_versions[name],
              }
              for name in sorted(before_versions.keys() & after_versions.keys())
              if before_versions[name] != after_versions[name]
          }

          audit = {
              'added_local_packages': sorted(after_local - before_local),
              'removed_local_packages': sorted(before_local - after_local),
              'added_registry_packages': sorted(after_reg - before_reg),
              'removed_registry_packages': sorted(before_reg - after_reg),
              'changed_registry_versions': changed_registry_versions,
              'added_git_packages': sorted(after_git - before_git),
              'removed_git_packages': sorted(before_git - after_git),
          }
          (root / 'lock-audit.json').write_text(json.dumps(audit, indent=2, sort_keys=True) + '\n')

          lines = [
              '# Cargo.lock reconciliation audit',
              '',
              f"Added local packages: {len(audit['added_local_packages'])}",
              f"Removed local packages: {len(audit['removed_local_packages'])}",
              f"Added registry package tuples: {len(audit['added_registry_packages'])}",
              f"Removed registry package tuples: {len(audit['removed_registry_packages'])}",
              f"Registry names with version-set changes: {len(changed_registry_versions)}",
              f"Added git package tuples: {len(audit['added_git_packages'])}",
              f"Removed git package tuples: {len(audit['removed_git_packages'])}",
              '',
              'This artifact is a repair candidate only. Any registry or git movement must be reviewed before commit.',
          ]
          (root / 'lock-audit.md').write_text('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY

      - name: Record candidate source and execution identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "subject_sha=$(git rev-parse HEAD)"
            echo "mycelix_parent_sha=$MYCELIX_PARENT_SHA"
            echo "mycelix_parent_tree=$MYCELIX_PARENT_TREE"
            echo "committed_lock_sha256=$(awk '{print $1}' lock-candidate/Cargo.lock.before.sha256)"
            echo "candidate_lock_sha256=$(awk '{print $1}' lock-candidate/Cargo.lock.candidate.sha256)"
            echo "flake_lock_sha256=$(awk '{print $1}' lock-candidate/flake.lock.before.sha256)"
            echo "rust_toolchain_file_sha256=$(awk '{print $1}' lock-candidate/rust-toolchain.toml.before.sha256)"
            echo "ci_dev_shell_drv=$(cat lock-candidate/ci-dev-shell.drv)"
            echo "checkout_action_sha=$CHECKOUT_ACTION_SHA"
            echo "install_nix_action_sha=$INSTALL_NIX_ACTION_SHA"
            echo "upload_artifact_action_sha=$UPLOAD_ARTIFACT_ACTION_SHA"
            echo "nix_version=$(nix --version)"
            echo "rustc_version=$(nix develop --no-write-lock-file .#ci --command rustc --version)"
            echo "cargo_version=$(nix develop --no-write-lock-file .#ci --command cargo --version)"
            echo "python_version=$(python3 --version 2>&1)"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "runner_image_os=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
            echo "execution_environment_authority=FlakeLockBound"
            echo "runner_identity_role=TransportFingerprintOnly"
            echo "authority=RepairCandidateOnly"
          } | tee lock-candidate/identity.txt

          git diff --exit-code -- Cargo.toml flake.lock rust-toolchain.toml

      - name: Upload reviewable lock candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clinical-assurance-lock-candidate
          path: lock-candidate/
          if-no-files-found: error
          retention-days: 14

      - name: Preserve non-authoritative boundary
        run: |
          echo 'The uploaded lockfile is not committed and is not qualification evidence.'
          echo 'Review lock-audit.json, Cargo.lock.diff, source identity, and environment identity before creating a new exact subject.'
