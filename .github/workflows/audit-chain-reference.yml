name: Audit Chain Reference

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/audit-chain-core/**'
      - '.github/workflows/audit-chain-reference.yml'
  push:
    branches:
      - 'feat/audit-chain-core-v1'
    paths:
      - 'crates/audit-chain-core/**'
      - '.github/workflows/audit-chain-reference.yml'

permissions:
  contents: read

jobs:
  qualify-audit-chain-semantics:
    name: Qualify fail-closed audit-chain semantics
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/audit-chain-core
    steps:
      - name: Check out exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
          rustc +1.96.0 -Vv
          cargo +1.96.0 -V

      - name: Freeze preflight identities
        run: |
          git rev-parse HEAD | tee /tmp/subject.sha
          sha256sum Cargo.toml Cargo.lock src/lib.rs README.md | tee /tmp/audit.before.sha256
          cargo +1.96.0 metadata --locked --no-deps --format-version 1 > /tmp/audit.metadata.json
          test "$(jq -r '.packages | length' /tmp/audit.metadata.json)" = "1"
          test "$(jq -r '.packages[0].name' /tmp/audit.metadata.json)" = "mycelix-audit-chain-core"

      - name: Check formatting
        run: cargo +1.96.0 fmt -- --check

      - name: Run tests
        run: cargo +1.96.0 test --locked

      - name: Run Clippy
        run: cargo +1.96.0 clippy --locked --all-targets -- -D warnings

      - name: Verify postflight immutability
        run: |
          test "$(git rev-parse HEAD)" = "$(cat /tmp/subject.sha)"
          sha256sum Cargo.toml Cargo.lock src/lib.rs README.md > /tmp/audit.after.sha256
          diff -u /tmp/audit.before.sha256 /tmp/audit.after.sha256
          git diff --exit-code -- Cargo.toml Cargo.lock src/lib.rs README.md

      - name: Evidence summary
        if: always()
        run: |
          {
            echo '## Audit-chain reference evidence'
            echo
            echo "- subject: $(git rev-parse HEAD)"
            echo "- runner: ubuntu-24.04"
            echo "- rustc: $(rustc +1.96.0 --version)"
            echo "- cargo: $(cargo +1.96.0 --version)"
            echo '- scope: per-author chain / multi-author checkpoint semantics only'
            echo '- invariant: unavailable/invalid predecessor state cannot become genesis'
            echo '- invariant: retrieval order is not chain order'
            echo '- non-claim: no production Holochain/hash/signature/atomicity/regulatory qualification'
          } >> "$GITHUB_STEP_SUMMARY"
