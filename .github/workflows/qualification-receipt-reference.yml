name: Qualification Receipt Reference

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/qualification-receipt-core/**'
      - '.github/workflows/qualification-receipt-reference.yml'
  push:
    branches:
      - 'feat/qualification-receipt-core-v1'
    paths:
      - 'crates/qualification-receipt-core/**'
      - '.github/workflows/qualification-receipt-reference.yml'

permissions:
  contents: read

jobs:
  qualify-governed-receipt-semantics:
    name: Qualify governed qualification receipt semantics
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/qualification-receipt-core
    steps:
      - name: Check out exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
          rustc +1.96.0 -Vv
          cargo +1.96.0 -V

      - name: Freeze preflight identities
        run: |
          git rev-parse HEAD | tee /tmp/subject.sha
          sha256sum Cargo.toml Cargo.lock README.md BOUNDARIES.md SOURCE_STATUS.md src/lib.rs src/model.rs src/strict.rs src/scoped.rs | tee /tmp/receipt.before.sha256
          cargo +1.96.0 metadata --locked --no-deps --format-version 1 > /tmp/receipt.metadata.json
          test "$(jq -r '.packages | length' /tmp/receipt.metadata.json)" = "1"
          test "$(jq -r '.packages[0].name' /tmp/receipt.metadata.json)" = "mycelix-qualification-receipt-core"

      - name: Static theorem guards
        run: |
          grep -q 'MYCELIX-HEALTH-QUALIFICATION-RECEIPT-V1' src/model.rs
          grep -q 'BoundApproverVerification' src/strict.rs
          grep -q 'AttestationReceiptMismatch' src/strict.rs
          grep -q 'GovernedAdmissionPolicy' src/strict.rs
          grep -q 'QualificationLineageBinding' src/scoped.rs
          grep -q 'LineageScopeMismatch' src/scoped.rs
          grep -q 'minimum_organizations' src/model.rs
          grep -q 'required_roles' src/model.rs
          grep -q 'NonceReplay' src/model.rs
          grep -q 'PredecessorMismatch' src/model.rs
          grep -q 'ClockRollback' src/model.rs
          grep -q 'IdempotentReplay' src/model.rs
          grep -q 'Superseded' src/model.rs
          grep -q 'Abandoned' src/model.rs
          grep -q 'SOURCE-STAGED / UNEXECUTED' SOURCE_STATUS.md
          grep -q 'raw lower-level `ApproverVerification`' BOUNDARIES.md
          grep -q 'pub use scoped::\*' src/lib.rs
          ! grep -q 'pub use model::\*' src/lib.rs
          ! grep -q 'pub use strict::\*' src/lib.rs
          ! grep -q 'pub mod model' src/lib.rs
          ! grep -q 'pub mod strict' src/lib.rs

      - name: Check formatting
        run: cargo +1.96.0 fmt -- --check

      - name: Run tests
        run: cargo +1.96.0 test --locked

      - name: Run Clippy
        run: cargo +1.96.0 clippy --locked --all-targets -- -D warnings

      - name: Verify postflight immutability
        run: |
          test "$(git rev-parse HEAD)" = "$(cat /tmp/subject.sha)"
          sha256sum Cargo.toml Cargo.lock README.md BOUNDARIES.md SOURCE_STATUS.md src/lib.rs src/model.rs src/strict.rs src/scoped.rs > /tmp/receipt.after.sha256
          diff -u /tmp/receipt.before.sha256 /tmp/receipt.after.sha256
          git diff --exit-code -- Cargo.toml Cargo.lock README.md BOUNDARIES.md SOURCE_STATUS.md src/lib.rs src/model.rs src/strict.rs src/scoped.rs

      - name: Evidence summary
        if: always()
        run: |
          {
            echo '## Governed qualification receipt reference evidence'
            echo
            echo "- subject: $(git rev-parse HEAD)"
            echo "- runner: ubuntu-24.04"
            echo "- rustc: $(rustc +1.96.0 --version)"
            echo "- cargo: $(cargo +1.96.0 --version)"
            echo '- scope: canonical statement + exact-policy multi-party admission + semantic-scope-bound per-lineage replay/disposition semantics only'
            echo '- invariant: approver verification binds exact receipt commitment'
            echo '- invariant: policy binds exact contract/admission scope/claim profile plus trust/deployment/time/role/org thresholds'
            echo '- invariant: opaque lineage ID cannot cross contract/subject/context/scope/claim-profile boundary'
            echo '- invariant: nonce/sequence/predecessor/clock rollback fail closed per lineage'
            echo '- non-claim: no signature/hash/trust-store/trusted-time/durable-distributed-ledger qualification'
          } >> "$GITHUB_STEP_SUMMARY"
