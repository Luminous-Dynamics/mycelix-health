name: Admin Authorization Reference

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/admin-authorization-core/**'
      - '.github/workflows/admin-authorization-reference.yml'
  push:
    branches:
      - 'feat/admin-authorization-core-v1'
    paths:
      - 'crates/admin-authorization-core/**'
      - '.github/workflows/admin-authorization-reference.yml'

permissions:
  contents: read

jobs:
  qualify-admin-semantics:
    name: Qualify fail-closed admin semantics
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/admin-authorization-core
    steps:
      - name: Check out exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
          rustc +1.96.0 -Vv
          cargo +1.96.0 -V

      - name: Freeze preflight identities
        run: |
          git rev-parse HEAD | tee /tmp/subject.sha
          sha256sum Cargo.toml Cargo.lock src/lib.rs README.md | tee /tmp/admin.before.sha256
          cargo +1.96.0 metadata --locked --no-deps --format-version 1 > /tmp/admin.metadata.json
          test "$(jq -r '.packages | length' /tmp/admin.metadata.json)" = "1"
          test "$(jq -r '.packages[0].name' /tmp/admin.metadata.json)" = "mycelix-admin-authorization-core"

      - name: Check formatting
        run: cargo +1.96.0 fmt -- --check

      - name: Run tests
        run: cargo +1.96.0 test --locked

      - name: Run Clippy
        run: cargo +1.96.0 clippy --locked --all-targets -- -D warnings

      - name: Verify postflight immutability
        run: |
          test "$(git rev-parse HEAD)" = "$(cat /tmp/subject.sha)"
          sha256sum Cargo.toml Cargo.lock src/lib.rs README.md > /tmp/admin.after.sha256
          diff -u /tmp/admin.before.sha256 /tmp/admin.after.sha256
          git diff --exit-code -- Cargo.toml Cargo.lock src/lib.rs README.md

      - name: Evidence summary
        if: always()
        run: |
          {
            echo '## Admin authorization reference evidence'
            echo
            echo "- subject: $(git rev-parse HEAD)"
            echo "- runner: ubuntu-24.04"
            echo "- rustc: $(rustc +1.96.0 --version)"
            echo "- cargo: $(cargo +1.96.0 --version)"
            echo '- scope: admin authorization/bootstrap semantics only'
            echo '- invariant: authorization dependency failure always denies'
            echo '- invariant: bootstrap is explicit, principal-bound and one-time'
            echo '- non-claim: no production Holochain registry/signature/bootstrap qualification'
          } >> "$GITHUB_STEP_SUMMARY"
