name: Qualification Checkpoint Adapter Integration

on:
  pull_request:
    branches:
      - 'feat/qualification-lineage-checkpoint-v1'
    paths:
      - 'crates/qualification-receipt-core/**'
      - 'crates/qualification-adapter-profile-core/**'
      - 'crates/qualification-checkpoint-adapter-core/**'
      - 'crates/qualification-product-authority-core/**'
      - 'scripts/qualification-receipt.py'
      - 'scripts/qualification-receipt-profile.py'
      - 'scripts/qualification-lineage-checkpoint.py'
      - 'scripts/qualification-lineage-checkpoint-admission.py'
      - 'scripts/test-qualification-receipt.py'
      - 'scripts/test-qualification-receipt-profile.py'
      - 'scripts/test-qualification-lineage-checkpoint.py'
      - 'scripts/test-qualification-lineage-checkpoint-admission.py'
      - 'docs/security/QUALIFICATION_CHECKPOINT_ADAPTER_INTEGRATION_V1.md'
      - 'docs/security/QUALIFICATION_CHECKPOINT_ADAPTER_INTEGRATION_V1_STATUS.md'
      - '.github/workflows/qualification-checkpoint-adapter-integration.yml'
  push:
    branches:
      - 'feat/qualification-checkpoint-adapter-integration-v1'

permissions:
  contents: read

jobs:
  qualify-checkpoint-adapter-integration:
    name: Qualify governed #214/#217 evidence -> exact #208 product token
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact stacked subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
          rustc +1.96.0 -Vv
          cargo +1.96.0 -V
          python3 --version
          openssl version

      - name: Freeze preflight identities
        run: |
          git rev-parse HEAD | tee /tmp/subject.sha
          find \
            crates/qualification-receipt-core \
            crates/qualification-adapter-profile-core \
            crates/qualification-checkpoint-adapter-core \
            crates/qualification-product-authority-core \
            -type d -name target -prune -o -type f -print0 \
            | sort -z | xargs -0 sha256sum \
            > /tmp/checkpoint-adapter.before.sha256
          sha256sum \
            scripts/qualification-receipt.py \
            scripts/qualification-receipt-profile.py \
            scripts/qualification-lineage-checkpoint.py \
            scripts/qualification-lineage-checkpoint-admission.py \
            scripts/test-qualification-receipt.py \
            scripts/test-qualification-receipt-profile.py \
            scripts/test-qualification-lineage-checkpoint.py \
            scripts/test-qualification-lineage-checkpoint-admission.py \
            docs/security/QUALIFICATION_CHECKPOINT_ADAPTER_INTEGRATION_V1.md \
            docs/security/QUALIFICATION_CHECKPOINT_ADAPTER_INTEGRATION_V1_STATUS.md \
            >> /tmp/checkpoint-adapter.before.sha256

      - name: Static final product-boundary guards
        run: |
          final='crates/qualification-product-authority-core/src/lib.rs'
          lower='crates/qualification-checkpoint-adapter-core/src/lib.rs'
          grep -q 'VerifiedProfile208Match' "$final"
          grep -q 'VerifiedCurrentHead208' "$final"
          grep -q 'Profile208ProductAuthorityToken' "$final"
          grep -q 'HeadProfileMatchMismatch' "$final"
          grep -q 'ProfileMatchInFuture' "$final"
          grep -q 'HeadVerifiedBeforeProfileMatch' "$final"
          grep -q 'VerifiedQualificationHeadCheckpoint' "$lower"
          grep -q 'mycelix-health-verified-qualification-head-checkpoint-v1' "$lower"
          grep -q 'checkpoint_bundle_digest' "$lower"
          grep -q 'lineage_state_commitment' "$lower"
          grep -q 'verified_head_digest' "$lower"
          grep -q 'QUAL-EVID-005/#216' crates/qualification-product-authority-core/README.md
          grep -q 'SOURCE-STAGED / UNEXECUTED' crates/qualification-product-authority-core/SOURCE_STATUS.md
          ! grep -nE '^pub use .*VerifiedLineageHead|pub struct VerifiedLineageHead|pub fn from_checkpoint_adapter' "$final"
          ! grep -n 'verified: bool' "$final"
          ! grep -n 'expected_profile_match:' "$final"
          ! grep -n 'AnyQualification' "$final"
          ! grep -nE '^pub use .*VerifiedLineageHead|pub struct VerifiedLineageHead|pub fn from_checkpoint_adapter' "$lower"
          ! grep -n 'verified: bool' "$lower"

      - name: Compile Python sources
        run: |
          python3 -m py_compile \
            scripts/qualification-receipt.py \
            scripts/qualification-receipt-profile.py \
            scripts/qualification-lineage-checkpoint.py \
            scripts/qualification-lineage-checkpoint-admission.py \
            scripts/test-qualification-receipt.py \
            scripts/test-qualification-receipt-profile.py \
            scripts/test-qualification-lineage-checkpoint.py \
            scripts/test-qualification-lineage-checkpoint-admission.py

      - name: Run governed qualification Ed25519 tests
        run: python3 scripts/test-qualification-receipt.py

      - name: Run exact #208 profile-match tests
        run: python3 scripts/test-qualification-receipt-profile.py

      - name: Run governed current-head checkpoint tests
        run: python3 scripts/test-qualification-lineage-checkpoint.py

      - name: Run strict checkpoint admission/tamper tests
        run: python3 scripts/test-qualification-lineage-checkpoint-admission.py

      - name: Check/test/Clippy receipt core
        run: |
          cargo +1.96.0 fmt --manifest-path crates/qualification-receipt-core/Cargo.toml -- --check
          cargo +1.96.0 test --locked --manifest-path crates/qualification-receipt-core/Cargo.toml
          cargo +1.96.0 clippy --locked --manifest-path crates/qualification-receipt-core/Cargo.toml --all-targets -- -D warnings

      - name: Check/test/Clippy QUAL-EVID-002 adapter core
        run: |
          cargo +1.96.0 fmt --manifest-path crates/qualification-adapter-profile-core/Cargo.toml -- --check
          cargo +1.96.0 test --locked --manifest-path crates/qualification-adapter-profile-core/Cargo.toml
          cargo +1.96.0 clippy --locked --manifest-path crates/qualification-adapter-profile-core/Cargo.toml --all-targets -- -D warnings

      - name: Check/test/Clippy checkpoint adapter core
        run: |
          cargo +1.96.0 metadata --locked --no-deps --format-version 1 \
            --manifest-path crates/qualification-checkpoint-adapter-core/Cargo.toml \
            > /tmp/checkpoint-adapter.metadata.json
          test "$(jq -r '.packages | length' /tmp/checkpoint-adapter.metadata.json)" = "1"
          test "$(jq -r '.packages[0].name' /tmp/checkpoint-adapter.metadata.json)" = "mycelix-qualification-checkpoint-adapter-core"
          cargo +1.96.0 fmt --manifest-path crates/qualification-checkpoint-adapter-core/Cargo.toml -- --check
          cargo +1.96.0 test --locked --manifest-path crates/qualification-checkpoint-adapter-core/Cargo.toml
          cargo +1.96.0 clippy --locked --manifest-path crates/qualification-checkpoint-adapter-core/Cargo.toml --all-targets -- -D warnings

      - name: Check/test/Clippy final product authority core
        run: |
          cargo +1.96.0 metadata --locked --no-deps --format-version 1 \
            --manifest-path crates/qualification-product-authority-core/Cargo.toml \
            > /tmp/product-authority.metadata.json
          test "$(jq -r '.packages | length' /tmp/product-authority.metadata.json)" = "1"
          test "$(jq -r '.packages[0].name' /tmp/product-authority.metadata.json)" = "mycelix-qualification-product-authority-core"
          cargo +1.96.0 fmt --manifest-path crates/qualification-product-authority-core/Cargo.toml -- --check
          cargo +1.96.0 test --locked --manifest-path crates/qualification-product-authority-core/Cargo.toml
          cargo +1.96.0 clippy --locked --manifest-path crates/qualification-product-authority-core/Cargo.toml --all-targets -- -D warnings

      - name: Verify postflight immutability
        run: |
          test "$(git rev-parse HEAD)" = "$(cat /tmp/subject.sha)"
          find \
            crates/qualification-receipt-core \
            crates/qualification-adapter-profile-core \
            crates/qualification-checkpoint-adapter-core \
            crates/qualification-product-authority-core \
            -type d -name target -prune -o -type f -print0 \
            | sort -z | xargs -0 sha256sum \
            > /tmp/checkpoint-adapter.after.sha256
          sha256sum \
            scripts/qualification-receipt.py \
            scripts/qualification-receipt-profile.py \
            scripts/qualification-lineage-checkpoint.py \
            scripts/qualification-lineage-checkpoint-admission.py \
            scripts/test-qualification-receipt.py \
            scripts/test-qualification-receipt-profile.py \
            scripts/test-qualification-lineage-checkpoint.py \
            scripts/test-qualification-lineage-checkpoint-admission.py \
            docs/security/QUALIFICATION_CHECKPOINT_ADAPTER_INTEGRATION_V1.md \
            docs/security/QUALIFICATION_CHECKPOINT_ADAPTER_INTEGRATION_V1_STATUS.md \
            >> /tmp/checkpoint-adapter.after.sha256
          diff -u /tmp/checkpoint-adapter.before.sha256 /tmp/checkpoint-adapter.after.sha256
          git diff --exit-code

      - name: Evidence summary
        if: always()
        run: |
          {
            echo '## QUAL-EVID-006 final product authority evidence'
            echo
            echo "- subject: $(git rev-parse HEAD)"
            echo '- parent: QUAL-EVID-004/#217 stack'
            echo "- rustc: $(rustc +1.96.0 --version 2>/dev/null || echo unavailable)"
            echo "- openssl: $(openssl version 2>/dev/null || echo unavailable)"
            echo '- scope: exact #214 profile artifact + #217 current-head artifact -> exact #208 typed product token'
            echo '- invariant: final product API exports no raw VerifiedLineageHead / verified: bool seam'
            echo '- invariant: final product gate accepts no caller-selected bare expected profile-match digest'
            echo '- invariant: profile/head/qualification lineage, receipt, policy, trust, deployment and commitment identities agree exactly'
            echo '- invariant: local receipt admissibility + #212 freshness/time semantics remain independently required'
            echo '- non-claim: no native Rust Ed25519 verification, no #216 rollback anchor, no Patient-v2 activation'
          } >> "$GITHUB_STEP_SUMMARY"
