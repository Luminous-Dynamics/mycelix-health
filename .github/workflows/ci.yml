name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Rust workspace checks
  rust:
    name: Rust Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # This repo depends on 4 crates via relative paths that only resolve when
      # checked out as the mycelix-health submodule of the parent `mycelix` repo:
      # mycelix-bridge-common, mycelix-leptos-core, mycelix-zkp-core (all under
      # `../crates/<name>`) and mycelix-fl (under `../mycelix-core/libs/mycelix-fl`
      # — a different sibling directory, not under crates/ at all). A bare
      # checkout of this repo alone (which is what CI does) has neither sibling
      # directory, so recreate both here — see CONTRACT.md's "Building this repo
      # standalone" section.
      - name: Check out sibling crates/ and mycelix-core/ from parent mycelix repo
        run: |
          git clone --depth 1 https://github.com/Luminous-Dynamics/mycelix.git /tmp/mycelix-parent
          mkdir -p ../crates ../mycelix-core ../mycelix-workspace/mycelix-core
          cp -r /tmp/mycelix-parent/crates/. ../crates/
          cp -r /tmp/mycelix-parent/mycelix-core/. ../mycelix-core/
          # mycelix-core is needed at TWO locations: this repo's own deps resolve
          # ../mycelix-core, but the parent's crates/mycelix-zkp-core (copied into
          # ../crates above) declares proofs-config / proofs-commitment as
          # `../../mycelix-workspace/mycelix-core/libs/...`. That path is correct
          # inside the mycelix repo, which carries mycelix-core at both the root and
          # under mycelix-workspace/ -- this checkout recreated only the first, so
          # clippy failed reading .../mycelix-workspace/mycelix-core/libs/proofs-commitment.
          cp -r /tmp/mycelix-parent/mycelix-core/. ../mycelix-workspace/mycelix-core/
          rm -rf /tmp/mycelix-parent

      - name: Install Rust
        # Was `dtolnay/rust-action@stable` -- no such action exists (the action is
        # `rust-toolchain`), so this step failed before any Rust work began.
        # Pinned to the same version as rust-toolchain.toml so only one toolchain
        # is provisioned, matching the convention used in the symthaea repo.
        # `targets` is required: .cargo/config.toml sets
        # `target = "wasm32-unknown-unknown"`, so every cargo invocation here is a
        # wasm build and the target must be present.
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install Holochain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        # NOT `--all`. This repo's four path dependencies deliberately reach
        # outside its own root into the parent mycelix repo, and `cargo fmt --all`
        # follows them -- so the gate was checking mycelix-fl, mycelix-zkp-core and
        # sovereign-profile, i.e. code this repo does not own, cannot fix, and which
        # is re-cloned fresh from mycelix's main on every run. Any formatting drift
        # over there turned this repo red for reasons no change here could resolve.
        # The scoped form still covers all 41 of this workspace's own members.
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Build workspace
        run: cargo build --workspace

      - name: Build release (all zomes)
        # The zome list is DERIVED from the workspace, not hardcoded. The previous
        # hardcoded list had drifted badly: 26 of the 36 packages it named no longer
        # existed (so the step failed outright on the first one, `sdoh`), while 12
        # zomes that DO exist were never built here at all. Deriving it means the
        # list cannot silently diverge from the repo again.
        run: |
          ARGS=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[] | select(.manifest_path | contains("/zomes/")) | "-p \(.name)"] | join(" ")')
          echo "Building zome packages: $ARGS"
          cargo build --release $ARGS
      - name: Run tests
        # Tests run on the HOST target, not the wasm32 default that .cargo/config.toml
        # forces. Zomes deploy as wasm, but their unit tests do not: building tests for
        # wasm32 drags in dev-dependencies that cannot compile there --
        #   error: Rayon cannot be used when targeting wasi32   (criterion)
        #   error[E0433]: cannot find module or crate `imp`     (wait-timeout)
        # -- so this step could never have run a single test. Verified locally against
        # the host triple: 84 suites, 429 tests, 0 failures.
        run: cargo test --workspace --target "$(rustc -vV | awk '/^host:/{print $2}')"


  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # cargo-deny builds the dependency graph, which means resolving this repo's
      # four path dependencies -- and those reach OUTSIDE the repo root into the
      # parent mycelix repo (../crates, ../mycelix-core), because this repo is
      # designed to be consumed as mycelix's mycelix-health submodule. Without
      # this step the job failed with:
      #   failed to read `/github/crates/mycelix-bridge-common/Cargo.toml`
      # The `rust` job above already does exactly this; `deny` was simply never
      # given the same treatment. See CONTRACT.md's "Building this repo standalone".
      - name: Check out sibling crates/ and mycelix-core/ from parent mycelix repo
        run: |
          git clone --depth 1 https://github.com/Luminous-Dynamics/mycelix.git /tmp/mycelix-parent
          mkdir -p ../crates ../mycelix-core ../mycelix-workspace/mycelix-core
          cp -r /tmp/mycelix-parent/crates/. ../crates/
          cp -r /tmp/mycelix-parent/mycelix-core/. ../mycelix-core/
          # mycelix-core is needed at TWO locations: this repo's own deps resolve
          # ../mycelix-core, but the parent's crates/mycelix-zkp-core (copied into
          # ../crates above) declares proofs-config / proofs-commitment as
          # `../../mycelix-workspace/mycelix-core/libs/...`. That path is correct
          # inside the mycelix repo, which carries mycelix-core at both the root and
          # under mycelix-workspace/ -- this checkout recreated only the first, so
          # clippy failed reading .../mycelix-workspace/mycelix-core/libs/proofs-commitment.
          cp -r /tmp/mycelix-parent/mycelix-core/. ../mycelix-workspace/mycelix-core/
          rm -rf /tmp/mycelix-parent

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # TypeScript SDK
  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # EHR Gateway Service
  ehr-gateway:
    name: EHR Gateway Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ehr-gateway
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/ehr-gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # Integration tests (requires Holochain conductor)
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [rust, sdk]
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Holochain
        uses: holochain/holochain-nix-setup-action@v1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Build hApp
        run: |
          nix develop --command bash -c "
            cargo build --release --workspace
            # Build WASM zomes and package hApp
          "

      - name: Run integration tests
        run: |
          cd tests/integration
          npm ci
          npm test
