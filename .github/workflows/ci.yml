name: CI

on:
  push:
    branches: [main, develop, fix/health-assurance-stack-2026-11-27]
  pull_request:
    branches: [main, develop, fix/health-assurance-stack-2026-11-27]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Rust workspace checks
  rust:
    name: Rust Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repo depends on 4 crates via relative paths that only resolve when
      # checked out as the mycelix-health submodule of the parent `mycelix` repo:
      # mycelix-bridge-common, mycelix-leptos-core, mycelix-zkp-core (all under
      # `../crates/<name>`) and mycelix-fl (under `../mycelix-core/libs/mycelix-fl`
      # — a different sibling directory, not under crates/ at all). A bare
      # checkout of this repo alone (which is what CI does) has neither sibling
      # directory, so recreate both here — see CONTRACT.md's "Building this repo
      # standalone" section.
      - name: Check out sibling crates/ and mycelix-core/ from parent mycelix repo
        run: |
          git clone --depth 1 https://github.com/Luminous-Dynamics/mycelix.git /tmp/mycelix-parent
          mkdir -p ../crates ../mycelix-core ../mycelix-workspace/mycelix-core
          cp -r /tmp/mycelix-parent/crates/. ../crates/
          cp -r /tmp/mycelix-parent/mycelix-core/. ../mycelix-core/
          # mycelix-core is needed at TWO locations: this repo's own deps resolve
          # ../mycelix-core, but the parent's crates/mycelix-zkp-core (copied into
          # ../crates above) declares proofs-config / proofs-commitment as
          # `../../mycelix-workspace/mycelix-core/libs/...`. That path is correct
          # inside the mycelix repo, which carries mycelix-core at both the root and
          # under mycelix-workspace/ -- this checkout recreated only the first, so
          # clippy failed reading .../mycelix-workspace/mycelix-core/libs/proofs-commitment.
          cp -r /tmp/mycelix-parent/mycelix-core/. ../mycelix-workspace/mycelix-core/
          rm -rf /tmp/mycelix-parent

      - name: Install Rust
        # Was `dtolnay/rust-action@stable` -- no such action exists (the action is
        # `rust-toolchain`), so this step failed before any Rust work began.
        # Pinned to the same version as rust-toolchain.toml so only one toolchain
        # is provisioned, matching the convention used in the symthaea repo.
        # `targets` is required: .cargo/config.toml sets
        # `target = "wasm32-unknown-unknown"`, so every cargo invocation here is a
        # wasm build and the target must be present.
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install Holochain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        # NOT `--all`. This repo's four path dependencies deliberately reach
        # outside its own root into the parent mycelix repo, and `cargo fmt --all`
        # follows them -- so the gate was checking mycelix-fl, mycelix-zkp-core and
        # sovereign-profile, i.e. code this repo does not own, cannot fix, and which
        # is re-cloned fresh from mycelix's main on every run. Any formatting drift
        # over there turned this repo red for reasons no change here could resolve.
        # The scoped form still covers all 41 of this workspace's own members.
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Build workspace
        run: cargo build --workspace

      - name: Build release (all zomes)
        # The zome list is DERIVED from the workspace, not hardcoded. The previous
        # hardcoded list had drifted badly: 26 of the 36 packages it named no longer
        # existed (so the step failed outright on the first one, `sdoh`), while 12
        # zomes that DO exist were never built here at all. Deriving it means the
        # list cannot silently diverge from the repo again.
        run: |
          ARGS=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[] | select(.manifest_path | contains("/zomes/")) | "-p \(.name)"] | join(" ")')
          echo "Building zome packages: $ARGS"
          cargo build --release $ARGS
      - name: Run tests
        # Tests run on the HOST target, not the wasm32 default that .cargo/config.toml
        # forces. Zomes deploy as wasm, but their unit tests do not: building tests for
        # wasm32 drags in dev-dependencies that cannot compile there --
        #   error: Rayon cannot be used when targeting wasi32   (criterion)
        #   error[E0433]: cannot find module or crate `imp`     (wait-timeout)
        # -- so this step could never have run a single test. Verified locally against
        # the host triple: 84 suites, 429 tests, 0 failures.
        run: cargo test --workspace --target "$(rustc -vV | awk '/^host:/{print $2}')"


  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cargo-deny builds the dependency graph, which means resolving this repo's
      # four path dependencies -- and those reach OUTSIDE the repo root into the
      # parent mycelix repo (../crates, ../mycelix-core), because this repo is
      # designed to be consumed as mycelix's mycelix-health submodule. Without
      # this step the job failed with:
      #   failed to read `/github/crates/mycelix-bridge-common/Cargo.toml`
      # The `rust` job above already does exactly this; `deny` was simply never
      # given the same treatment. See CONTRACT.md's "Building this repo standalone".
      - name: Check out sibling crates/ and mycelix-core/ from parent mycelix repo
        run: |
          git clone --depth 1 https://github.com/Luminous-Dynamics/mycelix.git /tmp/mycelix-parent
          mkdir -p ../crates ../mycelix-core ../mycelix-workspace/mycelix-core
          cp -r /tmp/mycelix-parent/crates/. ../crates/
          cp -r /tmp/mycelix-parent/mycelix-core/. ../mycelix-core/
          # mycelix-core is needed at TWO locations: this repo's own deps resolve
          # ../mycelix-core, but the parent's crates/mycelix-zkp-core (copied into
          # ../crates above) declares proofs-config / proofs-commitment as
          # `../../mycelix-workspace/mycelix-core/libs/...`. That path is correct
          # inside the mycelix repo, which carries mycelix-core at both the root and
          # under mycelix-workspace/ -- this checkout recreated only the first, so
          # clippy failed reading .../mycelix-workspace/mycelix-core/libs/proofs-commitment.
          cp -r /tmp/mycelix-parent/mycelix-core/. ../mycelix-workspace/mycelix-core/
          rm -rf /tmp/mycelix-parent

      # Run on the host rather than a Docker action container. The workspace
      # deliberately resolves sibling crates from ../crates and ../mycelix-core;
      # a container action only mounts GITHUB_WORKSPACE, not these sibling paths.
      - name: Install Rust for host-native dependency audit
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install cargo-deny (host target)
        run: cargo install cargo-deny --version 0.20.2 --locked --target "$(rustc -vV | awk '/^host:/{print $2}')"

      - name: Run cargo-deny with sibling workspace dependencies visible
        run: cargo deny check

  # TypeScript SDK
  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify pinned Holochain sodium wrapper
        run: |
          node -e '
            const p = require("libsodium-wrappers/package.json");
            if (p.version !== "0.7.15") {
              throw new Error("Expected libsodium-wrappers 0.7.15, resolved " + p.version);
            }
            console.log("libsodium-wrappers " + p.version + " pinned");
          '

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # EHR Gateway Service
  ehr-gateway:
    name: EHR Gateway Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ehr-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/ehr-gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # Integration tests use community Tryorama 0.19.x (compatible with HC 0.6.x).
  # The exact Holonix revision is pinned so conductor and CLI versions cannot drift.
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [rust, sdk]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # This standalone repository has four Cargo path dependencies supplied
      # by its parent Mycelix checkout: ../crates/*, ../mycelix-core, and
      # ../mycelix-workspace/mycelix-core. Stage the same complete, pinned
      # parent layout used by the Rust and cargo-deny jobs; do not copy only
      # mycelix-bridge-common or synthesize placeholders.
      - name: Checkout pinned parent Mycelix workspace
        uses: actions/checkout@v4
        with:
          repository: Luminous-Dynamics/mycelix
          ref: d597dcd99ccbf1cc3c341c3442ef6a53efd0dbff
          path: mycelix-parent
          persist-credentials: false

      - name: Stage all declared sibling path dependencies
        run: |
          set -euo pipefail
          source="$GITHUB_WORKSPACE/mycelix-parent"
          for target in ../crates ../mycelix-core ../mycelix-workspace/mycelix-core; do
            if [[ -e "$target" || -L "$target" ]]; then
              echo "Refusing to overwrite existing sibling dependency path: $target" >&2
              exit 1
            fi
          done

          mkdir -p ../crates ../mycelix-core ../mycelix-workspace/mycelix-core
          cp -a "$source/crates/." ../crates/
          cp -a "$source/mycelix-core/." ../mycelix-core/
          cp -a "$source/mycelix-core/." ../mycelix-workspace/mycelix-core/

          required=(
            ../crates/mycelix-bridge-common/Cargo.toml
            ../crates/mycelix-leptos-core/Cargo.toml
            ../crates/mycelix-zkp-core/Cargo.toml
            ../mycelix-core/libs/mycelix-fl/Cargo.toml
            ../mycelix-workspace/mycelix-core/libs/proofs-commitment/Cargo.toml
          )
          for manifest in "${required[@]}"; do
            test -s "$manifest" || {
              echo "Missing declared sibling workspace manifest: $manifest" >&2
              exit 1
            }
          done

          echo "upstream_commit=d597dcd99ccbf1cc3c341c3442ef6a53efd0dbff"
          for manifest in "${required[@]}"; do
            printf '%s %s\n' "$manifest" "$(sha256sum "$manifest" | cut -d' ' -f1)"
          done | tee "$RUNNER_TEMP/health-sibling-manifests.txt"

      - name: Install Nix with Holochain binary cache
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://holochain-ci.cachix.org
            extra-trusted-public-keys = holochain-ci.cachix.org-1:5IUSkZc0aoRS53rfkvH9Kid40NpyjwCMCzwRTXy+QN8=

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/integration/package-lock.json

      - name: Require committed integration lockfile
        run: |
          set -euo pipefail
          test -s tests/integration/package-lock.json
          node -e '
            const lock = require("./tests/integration/package-lock.json");
            const p = lock.packages || {};
            if (p["node_modules/@holochain/client"]?.version !== "0.20.8") {
              throw new Error("integration lockfile does not pin @holochain/client 0.20.8");
            }
            if (p["node_modules/@holochain/tryorama"]?.version !== "0.19.2") {
              throw new Error("integration lockfile does not pin @holochain/tryorama 0.19.2");
            }
          '

      - name: Build and package hApp in pinned Holonix 0.6
        env:
          HOLONIX_FLAKE: github:holochain/holonix/21d3a9f3eb1d7a533fc816ab53825f3ef35b0007
        run: |
          set -euo pipefail
          nix develop "$HOLONIX_FLAKE" --command bash -euo pipefail -c '
            echo "Holonix pinned to 21d3a9f3eb1d7a533fc816ab53825f3ef35b0007"
            holochain --version
            hc --version
            cargo build --release --workspace --target wasm32-unknown-unknown
            hc dna pack dna/
            hc app pack .
          '
          test -s dna/health.dna
          find . -maxdepth 1 -name "*.happ" -type f -size +0c | grep -q .

      - name: Run real two-conductor Tryorama integration tests
        env:
          HOLONIX_FLAKE: github:holochain/holonix/21d3a9f3eb1d7a533fc816ab53825f3ef35b0007
        run: |
          set -euo pipefail
          nix develop "$HOLONIX_FLAKE" --command bash -euo pipefail -c '
            cd tests/integration
            npm ci --no-audit --no-fund
            npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --skipLibCheck health.test.ts
            npm test
          '
