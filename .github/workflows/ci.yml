name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Standalone mycelix-health builds reconstruct four path dependencies from the
  # parent Mycelix repository. Pin that parent so an unchanged health commit does
  # not silently acquire a different dependency graph when mycelix/main moves.
  PARENT_MYCELIX_REF: ce7acdbd2afa6d40bcd669e14ba468b3214466c3

jobs:
  # Rust workspace checks
  rust:
    name: Rust Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repo depends on 4 crates via relative paths that only resolve when
      # checked out as the mycelix-health submodule of the parent `mycelix` repo:
      # mycelix-bridge-common, mycelix-leptos-core, mycelix-zkp-core (all under
      # `../crates/<name>`) and mycelix-fl (under `../mycelix-core/libs/mycelix-fl`
      # — a different sibling directory, not under crates/ at all). A bare
      # checkout of this repo alone (which is what CI does) has neither sibling
      # directory, so recreate both here — see CONTRACT.md's "Building this repo
      # standalone" section.
      - name: Check out pinned sibling crates/ and mycelix-core/ from parent mycelix repo
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/mycelix-parent
          git -C /tmp/mycelix-parent remote add origin https://github.com/Luminous-Dynamics/mycelix.git
          git -C /tmp/mycelix-parent fetch --depth 1 origin "$PARENT_MYCELIX_REF"
          git -C /tmp/mycelix-parent checkout --detach FETCH_HEAD
          test "$(git -C /tmp/mycelix-parent rev-parse HEAD)" = "$PARENT_MYCELIX_REF"
          echo "PARENT_MYCELIX_REF=$PARENT_MYCELIX_REF"

          mkdir -p ../crates ../mycelix-core ../mycelix-workspace/mycelix-core
          cp -r /tmp/mycelix-parent/crates/. ../crates/
          cp -r /tmp/mycelix-parent/mycelix-core/. ../mycelix-core/
          # mycelix-core is needed at TWO locations: this repo's own deps resolve
          # ../mycelix-core, but the parent's crates/mycelix-zkp-core (copied into
          # ../crates above) declares proofs-config / proofs-commitment as
          # `../../mycelix-workspace/mycelix-core/libs/...`. That path is correct
          # inside the mycelix repo, which carries mycelix-core at both the root and
          # under mycelix-workspace/ -- this checkout recreates both views.
          cp -r /tmp/mycelix-parent/mycelix-core/. ../mycelix-workspace/mycelix-core/
          rm -rf /tmp/mycelix-parent

      - name: Install Rust
        # Was `dtolnay/rust-action@stable` -- no such action exists (the action is
        # `rust-toolchain`), so this step failed before any Rust work began.
        # Pinned to the same version as rust-toolchain.toml so only one toolchain
        # is provisioned, matching the convention used in the symthaea repo.
        # `targets` is required: .cargo/config.toml sets
        # `target = "wasm32-unknown-unknown"`, so every cargo invocation here is a
        # wasm build and the target must be present.
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install Holochain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        # NOT `--all`. This repo's four path dependencies deliberately reach
        # outside its own root into the parent mycelix repo, and `cargo fmt --all`
        # follows them -- so the gate was checking mycelix-fl, mycelix-zkp-core and
        # sovereign-profile, i.e. code this repo does not own, cannot fix, and which
        # is reconstructed from the pinned parent on every run. Any formatting drift
        # over there should not turn this repo red for code this repo does not own.
        # The scoped form still covers this workspace's own members.
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Build workspace
        run: cargo build --workspace

      - name: Build release (all zomes)
        # The zome list is DERIVED from the workspace, not hardcoded. The previous
        # hardcoded list had drifted badly; deriving it means the list cannot silently
        # diverge from the repo again.
        run: |
          ARGS=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[] | select(.manifest_path | contains("/zomes/")) | "-p \(.name)"] | join(" ")')
          echo "Building zome packages: $ARGS"
          cargo build --release $ARGS
      - name: Run tests
        # Tests run on the HOST target, not the wasm32 default that .cargo/config.toml
        # forces. Zomes deploy as wasm, but their unit tests do not.
        run: cargo test --workspace --target "$(rustc -vV | awk '/^host:/{print $2}')"

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cargo-deny builds the dependency graph, which means resolving this repo's
      # four path dependencies. Recreate the exact same pinned sibling layout used
      # by the Rust job before running cargo-deny on the host runner.
      - name: Check out pinned sibling crates/ and mycelix-core/ from parent mycelix repo
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/mycelix-parent
          git -C /tmp/mycelix-parent remote add origin https://github.com/Luminous-Dynamics/mycelix.git
          git -C /tmp/mycelix-parent fetch --depth 1 origin "$PARENT_MYCELIX_REF"
          git -C /tmp/mycelix-parent checkout --detach FETCH_HEAD
          test "$(git -C /tmp/mycelix-parent rev-parse HEAD)" = "$PARENT_MYCELIX_REF"
          echo "PARENT_MYCELIX_REF=$PARENT_MYCELIX_REF"

          mkdir -p ../crates ../mycelix-core ../mycelix-workspace/mycelix-core
          cp -r /tmp/mycelix-parent/crates/. ../crates/
          cp -r /tmp/mycelix-parent/mycelix-core/. ../mycelix-core/
          cp -r /tmp/mycelix-parent/mycelix-core/. ../mycelix-workspace/mycelix-core/
          rm -rf /tmp/mycelix-parent
          test -f ../crates/mycelix-bridge-common/Cargo.toml
          test -d ../mycelix-core/libs/mycelix-fl
          test -d ../mycelix-workspace/mycelix-core/libs

      # The cargo-deny GitHub Action executes inside a Docker container that mounts
      # only this repository as /github/workspace. Relative dependencies such as
      # ../crates then resolve to /github/crates, which is not mounted, so graph
      # construction fails before policy evaluation. Use the exact upstream binary
      # on the host instead, where the reconstructed sibling layout is visible.
      - name: Install checksum-pinned cargo-deny 0.20.2
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/cargo-deny.tar.gz
          url=https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          expected=9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
          curl --fail --location --silent --show-error "$url" -o "$archive"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          test "$actual" = "$expected"
          mkdir -p /tmp/cargo-deny
          tar -xzf "$archive" -C /tmp/cargo-deny --strip-components=1
          test -x /tmp/cargo-deny/cargo-deny
          /tmp/cargo-deny/cargo-deny --version

      - name: Run cargo-deny on host workspace
        run: /tmp/cargo-deny/cargo-deny check

  # TypeScript SDK
  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # EHR Gateway Service
  ehr-gateway:
    name: EHR Gateway Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ehr-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/ehr-gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # Integration tests (requires Holochain conductor)
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [rust, sdk]
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Holochain
        uses: holochain/holochain-nix-setup-action@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build hApp
        run: |
          nix develop --command bash -c "
            cargo build --release --workspace
            # Build WASM zomes and package hApp
          "

      - name: Run integration tests
        run: |
          cd tests/integration
          npm ci
          npm test
