name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Rust workspace checks
  rust:
    name: Rust Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repo depends on 4 crates via relative paths that only resolve when
      # checked out as the mycelix-health submodule of the parent `mycelix` repo:
      # mycelix-bridge-common, mycelix-leptos-core, mycelix-zkp-core (all under
      # `../crates/<name>`) and mycelix-fl (under `../mycelix-core/libs/mycelix-fl`
      # — a different sibling directory, not under crates/ at all). A bare
      # checkout of this repo alone (which is what CI does) has neither sibling
      # directory, so recreate both here — see CONTRACT.md's "Building this repo
      # standalone" section.
      - name: Check out sibling crates/ and mycelix-core/ from parent mycelix repo
        run: |
          git clone --depth 1 https://github.com/Luminous-Dynamics/mycelix.git /tmp/mycelix-parent
          mkdir -p ../crates ../mycelix-core
          cp -r /tmp/mycelix-parent/crates/. ../crates/
          cp -r /tmp/mycelix-parent/mycelix-core/. ../mycelix-core/
          rm -rf /tmp/mycelix-parent

      - name: Install Rust
        # Was `dtolnay/rust-action@stable` -- no such action exists (the action is
        # `rust-toolchain`), so this step failed before any Rust work began.
        # Pinned to the same version as rust-toolchain.toml so only one toolchain
        # is provisioned, matching the convention used in the symthaea repo.
        # `targets` is required: .cargo/config.toml sets
        # `target = "wasm32-unknown-unknown"`, so every cargo invocation here is a
        # wasm build and the target must be present.
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install Holochain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        # NOT `--all`. This repo's four path dependencies deliberately reach
        # outside its own root into the parent mycelix repo, and `cargo fmt --all`
        # follows them -- so the gate was checking mycelix-fl, mycelix-zkp-core and
        # sovereign-profile, i.e. code this repo does not own, cannot fix, and which
        # is re-cloned fresh from mycelix's main on every run. Any formatting drift
        # over there turned this repo red for reasons no change here could resolve.
        # The scoped form still covers all 41 of this workspace's own members.
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Build workspace
        run: cargo build --workspace

      - name: Build release (all zomes)
        run: |
          # Phase 3 - Clinical Integration
          cargo build --release -p fhir_mapping_integrity -p fhir_mapping
          cargo build --release -p cds_integrity -p cds
          cargo build --release -p provider_directory_integrity -p provider_directory
          cargo build --release -p telehealth_integrity -p telehealth
          # Phase 4 - Equity & Access
          cargo build --release -p sdoh_integrity -p sdoh
          cargo build --release -p mental_health_integrity -p mental_health
          cargo build --release -p chronic_care_integrity -p chronic_care
          cargo build --release -p pediatric_integrity -p pediatric
          # Phase 5 - Advanced Research
          cargo build --release -p research_commons_integrity -p research_commons
          cargo build --release -p trial_matching_integrity -p trial_matching
          cargo build --release -p irb_integrity -p irb
          cargo build --release -p federated_learning_integrity -p federated_learning
          cargo build --release -p population_health_integrity -p population_health
          # Phase 6 - Global Scale
          cargo build --release -p ips_integrity -p ips
          cargo build --release -p i18n_integrity -p i18n
          cargo build --release -p disaster_response_integrity -p disaster_response
          cargo build --release -p verifiable_credentials_integrity -p verifiable_credentials
          cargo build --release -p mobile_support_integrity -p mobile_support

      - name: Run tests
        run: cargo test --workspace

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cargo-deny builds the dependency graph, which means resolving this repo's
      # four path dependencies -- and those reach OUTSIDE the repo root into the
      # parent mycelix repo (../crates, ../mycelix-core), because this repo is
      # designed to be consumed as mycelix's mycelix-health submodule. Without
      # this step the job failed with:
      #   failed to read `/github/crates/mycelix-bridge-common/Cargo.toml`
      # The `rust` job above already does exactly this; `deny` was simply never
      # given the same treatment. See CONTRACT.md's "Building this repo standalone".
      - name: Check out sibling crates/ and mycelix-core/ from parent mycelix repo
        run: |
          git clone --depth 1 https://github.com/Luminous-Dynamics/mycelix.git /tmp/mycelix-parent
          mkdir -p ../crates ../mycelix-core
          cp -r /tmp/mycelix-parent/crates/. ../crates/
          cp -r /tmp/mycelix-parent/mycelix-core/. ../mycelix-core/
          rm -rf /tmp/mycelix-parent

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # TypeScript SDK
  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # EHR Gateway Service
  ehr-gateway:
    name: EHR Gateway Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ehr-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/ehr-gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # Integration tests (requires Holochain conductor)
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [rust, sdk]
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Holochain
        uses: holochain/holochain-nix-setup-action@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build hApp
        run: |
          nix develop --command bash -c "
            cargo build --release --workspace
            # Build WASM zomes and package hApp
          "

      - name: Run integration tests
        run: |
          cd tests/integration
          npm ci
          npm test
