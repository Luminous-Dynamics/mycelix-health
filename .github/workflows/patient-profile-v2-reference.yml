name: Patient Profile V2 Reference

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/patient-profile-v2/**'
      - 'zomes/patient/integrity/src/lib.rs'
      - 'scripts/check_patient_v1_field_routing.py'
      - '.github/workflows/patient-profile-v2-reference.yml'
  push:
    branches:
      - 'feat/patient-profile-v2-reference'
    paths:
      - 'crates/patient-profile-v2/**'
      - 'zomes/patient/integrity/src/lib.rs'
      - 'scripts/check_patient_v1_field_routing.py'
      - '.github/workflows/patient-profile-v2-reference.yml'

permissions:
  contents: read

jobs:
  qualify-patient-v2-semantics:
    name: Qualify patient v2 migration semantics
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/patient-profile-v2
    steps:
      - name: Check out exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
          rustc +1.96.0 -Vv
          cargo +1.96.0 -V

      - name: Freeze preflight identities
        run: |
          git rev-parse HEAD | tee /tmp/subject.sha
          sha256sum \
            Cargo.toml Cargo.lock src/lib.rs src/wrapper.rs README.md legacy_field_routes.json \
            ../../scripts/check_patient_v1_field_routing.py \
            ../../zomes/patient/integrity/src/lib.rs \
            | tee /tmp/patient-v2.before.sha256
          cargo +1.96.0 metadata --locked --no-deps --format-version 1 > /tmp/patient-v2.metadata.json
          test "$(jq -r '.packages | length' /tmp/patient-v2.metadata.json)" = "1"
          test "$(jq -r '.packages[0].name' /tmp/patient-v2.metadata.json)" = "mycelix-patient-profile-v2"

      - name: Verify exact v1 source-field routing
        run: |
          cd ../..
          python3 scripts/check_patient_v1_field_routing.py

      - name: Prove routing gate rejects a new unclassified v1 field
        run: |
          cp ../../zomes/patient/integrity/src/lib.rs /tmp/patient-integrity-canary.rs
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/patient-integrity-canary.rs')
          text = path.read_text()
          marker = 'pub struct Patient {\n'
          if marker not in text:
              raise SystemExit('could not locate Patient struct marker for negative canary')
          text = text.replace(marker, marker + '    pub privacy_gate_canary: String,\n', 1)
          path.write_text(text)
          PY
          cd ../..
          if python3 scripts/check_patient_v1_field_routing.py --source /tmp/patient-integrity-canary.rs; then
            echo 'routing checker accepted an unclassified field' >&2
            exit 1
          fi
          python3 scripts/check_patient_v1_field_routing.py

      - name: Check formatting
        run: cargo +1.96.0 fmt -- --check

      - name: Run tests
        run: cargo +1.96.0 test --locked

      - name: Run Clippy
        run: cargo +1.96.0 clippy --locked --all-targets -- -D warnings

      - name: Verify postflight immutability
        run: |
          test "$(git rev-parse HEAD)" = "$(cat /tmp/subject.sha)"
          sha256sum \
            Cargo.toml Cargo.lock src/lib.rs src/wrapper.rs README.md legacy_field_routes.json \
            ../../scripts/check_patient_v1_field_routing.py \
            ../../zomes/patient/integrity/src/lib.rs \
            > /tmp/patient-v2.after.sha256
          diff -u /tmp/patient-v2.before.sha256 /tmp/patient-v2.after.sha256
          git diff --exit-code -- \
            Cargo.toml Cargo.lock src/lib.rs src/wrapper.rs README.md legacy_field_routes.json \
            ../../scripts/check_patient_v1_field_routing.py \
            ../../zomes/patient/integrity/src/lib.rs

      - name: Evidence summary
        if: always()
        run: |
          {
            echo '## Patient Profile V2 reference evidence'
            echo
            echo "- subject: $(git rev-parse HEAD)"
            echo "- runner: ubuntu-24.04"
            echo "- rustc: $(rustc +1.96.0 --version)"
            echo "- cargo: $(cargo +1.96.0 --version)"
            echo '- scope: patient-v1 field routing / v2 cutover semantics only'
            echo '- source binding: exact patient integrity source field list'
            echo '- negative canary: unclassified source-field addition must fail'
            echo '- invariant: V2 read failure never falls back to v1 plaintext'
            echo '- invariant: historical public exposure may persist is always true'
            echo '- non-claim: no encryption/Holochain/confidentiality/regulatory qualification'
          } >> "$GITHUB_STEP_SUMMARY"
