name: Patient v2 Cutover Composition Reference

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/patient-v2-cutover-composition-core/**'
      - '.github/workflows/patient-v2-cutover-composition-reference.yml'
  push:
    branches:
      - 'feat/patient-v2-cutover-composition-core-v1'
    paths:
      - 'crates/patient-v2-cutover-composition-core/**'
      - '.github/workflows/patient-v2-cutover-composition-reference.yml'

permissions:
  contents: read

jobs:
  qualify-final-cutover-composition:
    name: Qualify final Patient v2 composition semantics
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/patient-v2-cutover-composition-core
    steps:
      - name: Check out exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
          rustc +1.96.0 -Vv
          cargo +1.96.0 -V

      - name: Freeze preflight identities
        run: |
          git rev-parse HEAD | tee /tmp/subject.sha
          sha256sum Cargo.toml Cargo.lock README.md SOURCE_STATUS.md PR_NOTES.md src/lib.rs src/canonical.rs | tee /tmp/composition.before.sha256
          cargo +1.96.0 metadata --locked --no-deps --format-version 1 > /tmp/composition.metadata.json
          test "$(jq -r '.packages | length' /tmp/composition.metadata.json)" = "1"
          test "$(jq -r '.packages[0].name' /tmp/composition.metadata.json)" = "mycelix-patient-v2-cutover-composition-core"

      - name: Static theorem guards
        run: |
          grep -q 'REQUIRED_ACTIVATION_CONTRACT_V2' src/canonical.rs
          grep -q 'REQUIRED_MIGRATION_CONTRACT_V1' src/canonical.rs
          grep -q 'prepared_at_micros' src/canonical.rs
          grep -q 'activated_at_micros' src/canonical.rs
          grep -q 'legacy_v1_read_only' src/canonical.rs
          grep -q 'v2_discoverable' src/canonical.rs
          grep -q 'IdempotentReplay' src/canonical.rs
          grep -q 'ConflictingReplay' src/canonical.rs
          grep -q 'AuthoritySubstitution' src/canonical.rs
          grep -q 'SOURCE-STAGED / UNEXECUTED' SOURCE_STATUS.md
          ! grep -R -nE 'force_activate|override_activation|LegacyV1Writable' src

      - name: Check formatting
        run: cargo +1.96.0 fmt -- --check

      - name: Run tests
        run: cargo +1.96.0 test --locked

      - name: Run Clippy
        run: cargo +1.96.0 clippy --locked --all-targets -- -D warnings

      - name: Verify postflight immutability
        run: |
          test "$(git rev-parse HEAD)" = "$(cat /tmp/subject.sha)"
          sha256sum Cargo.toml Cargo.lock README.md SOURCE_STATUS.md PR_NOTES.md src/lib.rs src/canonical.rs > /tmp/composition.after.sha256
          diff -u /tmp/composition.before.sha256 /tmp/composition.after.sha256
          git diff --exit-code -- Cargo.toml Cargo.lock README.md SOURCE_STATUS.md PR_NOTES.md src/lib.rs src/canonical.rs

      - name: Evidence summary
        if: always()
        run: |
          {
            echo '## Patient v2 final composition reference evidence'
            echo
            echo "- subject: $(git rev-parse HEAD)"
            echo "- runner: ubuntu-24.04"
            echo "- rustc: $(rustc +1.96.0 --version)"
            echo "- cargo: $(cargo +1.96.0 --version)"
            echo '- scope: cross-receipt coherence + durable prepare/activation + crash recovery semantics only'
            echo '- invariant: #204/#206 identities must refer to one exact cutover'
            echo '- invariant: final authority binds exact migration destination and cannot be substituted at commit'
            echo '- invariant: recovered durable prepare/activation preserves monotonic timestamp floor'
            echo '- invariant: no final-coordinator state reopens legacy-v1 writes'
            echo '- non-claim: no migration/crypto/hash/trusted-time/Holochain/atomicity/regulatory qualification'
          } >> "$GITHUB_STEP_SUMMARY"
