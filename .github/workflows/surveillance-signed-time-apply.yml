name: Apply Reviewed Surveillance Signed-Time Repair

on:
  push:
    branches: [feat/public-health-observation-endorsement-v1]
    paths:
      - ".github/workflows/surveillance-signed-time-apply.yml"

permissions:
  contents: write

concurrency:
  group: surveillance-signed-time-apply
  cancel-in-progress: false

jobs:
  apply-signed-time-repair:
    name: Remove author-clock authority semantics
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / node24
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Verify exact source preconditions
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git hash-object zomes/surveillance/integrity/src/lib.rs)" = "2e0ea53cece24a1682ccbc237b0259512c22dd8e"
          test "$(git hash-object zomes/surveillance/coordinator/src/lib.rs)" = "195d83951281625e7bc31301a2c984e761d5d9a8"

      - name: Apply reviewed semantic transformation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          integrity_path = Path("zomes/surveillance/integrity/src/lib.rs")
          coordinator_path = Path("zomes/surveillance/coordinator/src/lib.rs")
          integrity = integrity_path.read_text()
          coordinator = coordinator_path.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          integrity = replace_once(
              integrity,
              "#[dna_properties]\n#[derive(Clone, Debug, PartialEq)]\npub struct SurveillanceDnaProperties",
              "#[dna_properties]\n#[derive(Clone, PartialEq)]\npub struct SurveillanceDnaProperties",
              "duplicate dna_properties Debug derive",
          )
          integrity = replace_once(
              integrity,
              "validate_released_entry(&action.author, action.timestamp, &entry)",
              "validate_released_entry(&action.author, &entry)",
              "integrity callback action timestamp",
          )
          integrity = replace_once(
              integrity,
              "fn validate_released_entry(\n    action_author: &AgentPubKey,\n    action_timestamp: Timestamp,\n    entry: &ReleasedSurveillanceObservation,\n)",
              "fn validate_released_entry(\n    action_author: &AgentPubKey,\n    entry: &ReleasedSurveillanceObservation,\n)",
              "validate_released_entry signature",
          )
          integrity = replace_once(
              integrity,
              "    let authored_at_unix_s = action_timestamp.as_micros().div_euclid(1_000_000);\n",
              "",
              "author timestamp conversion",
          )
          integrity = replace_once(
              integrity,
              "        action_author,\n        authored_at_unix_s,\n        entry,",
              "        action_author,\n        entry,",
              "validator wrapper authored time argument",
          )
          integrity = replace_once(
              integrity,
              "pub fn validate_released_entry_semantics(\n    action_author: &AgentPubKey,\n    authored_at_unix_s: i64,\n    entry: &ReleasedSurveillanceObservation,",
              "pub fn validate_released_entry_semantics(\n    action_author: &AgentPubKey,\n    entry: &ReleasedSurveillanceObservation,",
              "pure validator authored time parameter",
          )
          integrity = replace_once(
              integrity,
              ".assess_claimed_scope(&entry.observation, authored_at_unix_s)",
              ".assess_claimed_scope(\n            &entry.observation,\n            entry.status_endorsement.checked_at_unix_s(),\n        )",
              "grant validity clock",
          )

          # Existing pure-validator tests all supplied the same synthetic 14_000
          # wall-clock argument. Remove it now that the signed endorsement time is
          # the only authority-evaluation time.
          old_test_arg = "            14_000,\n"
          test_count = integrity.count(old_test_arg)
          if test_count != 6:
              raise SystemExit(f"expected 6 synthetic wall-clock test args, found {test_count}")
          integrity = integrity.replace(old_test_arg, "")

          # Add one explicit expiry-at-signed-check-time regression test.
          marker = "    #[test]\n    fn release_policy_substitution_fails_status_binding() {"
          if integrity.count(marker) != 1:
              raise SystemExit("could not locate final endorsement regression-test insertion point")
          new_test = '''    #[test]\n    fn signed_status_check_time_controls_grant_validity() {\n        let publisher = agent(1);\n        let issuer = agent(3);\n        let mut entry = released_entry(&publisher, &issuer, observation(100));\n        let release = release_policy();\n        entry.status_endorsement = AuthorizedObservationEndorsement::new(\n            id("mycelix-vc-active-status-v1"),\n            entry.authority_grant.issuer_did().clone(),\n            entry.authority_grant.id().unwrap(),\n            entry.observation.id().unwrap(),\n            *release.policy_id.as_bytes(),\n            id(&did(&publisher)),\n            entry.observation.provenance.producer.clone(),\n            20_001,\n            [9; 32],\n            [8; 32],\n        )\n        .unwrap();\n\n        assert!(validate_released_entry_semantics(\n            &publisher,\n            &entry,\n            &release,\n            &authority_policy(&issuer),\n        )\n        .is_err());\n    }\n\n'''
          integrity = integrity.replace(marker, new_test + marker, 1)

          coordinator = replace_once(
              coordinator,
              "    let now = sys_time()?;\n    let now_unix_s = now.as_micros().div_euclid(1_000_000);\n",
              "",
              "coordinator sys_time authority clock",
          )
          coordinator = replace_once(
              coordinator,
              "        &publisher,\n        now_unix_s,\n        &entry,",
              "        &publisher,\n        &entry,",
              "coordinator validator wall-clock argument",
          )

          integrity_path.write_text(integrity)
          coordinator_path.write_text(coordinator)
          PY

      - name: Verify reviewed diff boundary
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "zomes/surveillance/coordinator/src/lib.rs zomes/surveillance/integrity/src/lib.rs "
          ! grep -q 'action.timestamp' zomes/surveillance/integrity/src/lib.rs
          ! grep -q 'sys_time()' zomes/surveillance/coordinator/src/lib.rs
          grep -q 'entry.status_endorsement.checked_at_unix_s()' zomes/surveillance/integrity/src/lib.rs
          grep -q '#\[derive(Clone, PartialEq)\]' zomes/surveillance/integrity/src/lib.rs
          grep -q 'signed_status_check_time_controls_grant_validity' zomes/surveillance/integrity/src/lib.rs

      - name: Commit reviewed signed-time repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zomes/surveillance/integrity/src/lib.rs zomes/surveillance/coordinator/src/lib.rs
          git commit -m "fix(surveillance): bind grant validity to signed status time"
          git push origin HEAD:feat/public-health-observation-endorsement-v1
